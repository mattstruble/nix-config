# Local PVs + PVCs so model pods mount the nix store (binaries) and model weights
# without raw hostPath — keeps the model pods PSS `restricted`. Both are
# read-only and shared by many pods -> ReadOnlyMany. The PVCs are what the ai chart binds to; without
# them the chart is not reproducible on a fresh cluster. nodeAffinity selects
# on the stable `storage=mjolnir` node label (set via services.k3s.nodeLabel in
# nix/services/k3s.nix), not kubernetes.io/hostname, so a node rename does not
# orphan the PVs.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nix-store
  labels:
    app.kubernetes.io/part-of: ai
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nix-store
  local:
    path: /nix/store
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage
              operator: In
              values:
                - mjolnir
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llama-models
  labels:
    app.kubernetes.io/part-of: ai
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: llama-models
  local:
    path: /var/lib/llama-models
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage
              operator: In
              values:
                - mjolnir
---
# Postgres data for the LiteLLM key store. Static hostPath PV (not local-path)
# because the postgres pod runs non-root (uid 999) and the cluster's non-root
# policy forbids a root chown initContainer; the host dir is pre-created owned
# by 999 (see systemd.tmpfiles.rules in k3s.nix) so the pod can write it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/part-of: ai
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: postgres-data
  local:
    path: /var/lib/postgres-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage
              operator: In
              values:
                - mjolnir
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nix-store-pvc
  labels:
    app.kubernetes.io/part-of: ai
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: nix-store
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-models-pvc
  labels:
    app.kubernetes.io/part-of: ai
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: llama-models
  resources:
    requests:
      storage: 500Gi
