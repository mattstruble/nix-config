# Service account + RBAC for scraping kubelet /metrics (10250).
#
# k3s' kubelet requires a bearer token with the system:node-reader role. The
# chart's default kubelet ServiceMonitor uses the Prometheus SA token, which
# lacks that role -> 401 -> KubeletDown / KubeletInstanceUnreachable / TargetDown.
#
# The token secret (kubelet-monitoring-token) is minted at activation time
# (see nix/services/k3s.nix) because k8s 1.24+ no longer auto-creates SA token
# secrets. The kubelet ServiceMonitor's authorization points at this secret
# (see k8s/apps/monitoring/values/kube-prometheus-stack.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelet-monitoring
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubelet-monitoring-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # system:node-reader (a standard k8s ClusterRole that k3s ships) grants get
  # on nodes + nodes/proxy — the kubelet /metrics path — the least privilege
  # the scrape needs.
  name: system:node-reader
subjects:
  - kind: ServiceAccount
    name: kubelet-monitoring
    namespace: monitoring
