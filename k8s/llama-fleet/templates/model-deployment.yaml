{{- range $name, $m := .Values.models }}
{{- if $m.enable }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: llama-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: llama-fleet
    spec:
      runtimeClassName: nvidia
      containers:
        - name: llama-server
          image: {{ $m.image }}
          {{- with $m.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          # the fleet appends --host/--port (llama-server defaults to :8080)
          # quote every arg: YAML parses on/off as booleans and bare numbers as ints,
          # and k8s args must all be strings.
          args:
            {{- range $m.args }}
            - {{ . | quote }}
            {{- end }}
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ $m.port | quote }}
            # the running model name: single source of truth (also the gateway's model_name)
            - "--alias"
            - {{ $m.modelName | quote }}
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: {{ $m.gpu | quote }}
          ports:
            - containerPort: {{ $m.port }}
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            {{- if $m.nixBinary }}
            - name: nix-store
              mountPath: /nix/store
              readOnly: true
            {{- end }}
            {{- if $m.chatTemplate }}
            # single-file subPath mount: adds /app/qwen3-chat-template.jinja without
            # shadowing the image's /app (where the llama-server binary lives).
            - name: chat-template
              mountPath: /app/qwen3-chat-template.jinja
              subPath: qwen3-chat-template.jinja
              readOnly: true
            {{- end }}
            {{- range $m.extraMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ .readOnly | default false }}
            {{- end }}
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              memory: {{ $m.memoryRequest }}
            limits:
              memory: {{ $m.memoryLimit }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models-pvc
        {{- if $m.nixBinary }}
        - name: nix-store
          persistentVolumeClaim:
            claimName: nix-store-pvc
        {{- end }}
        {{- if $m.chatTemplate }}
        - name: chat-template
          configMap:
            name: qwen3-chat-template
        {{- end }}
        {{- range $m.extraVolumes }}
        - name: {{ .name }}
          {{- if .emptyDir }}
          emptyDir: {{ toYaml .emptyDir | nindent 12 }}
          {{- end }}
          {{- if .hostPath }}
          hostPath:
            path: {{ .hostPath }}
            type: DirectoryOrCreate
          {{- end }}
        {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
---
{{- end }}
{{- end }}
