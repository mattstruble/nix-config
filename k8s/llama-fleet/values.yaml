# One entry per model. enable: false = no pod, no gateway route (mirrors the
# nix switchboard in modules/hosts/mjolnir/_llama-models.nix). Adding a model =
# adding one entry here; the chart renders a Deployment + Service for it AND adds
# it to the LiteLLM gateway model_list.
#
#   image:      digest-pinned. Image models use the image's /app/llama-server;
#               fork models set nixBinary: true + command: [/nix/store/<hash>/bin/llama-server]
#   gpu:        "0" or "1" (CDI-mode nvidia runtime honours NVIDIA_VISIBLE_DEVICES)
#   port:       the port llama-server listens on (in-pod + Service)
#   nixBinary:  true = mount /nix/store (fork binary); false = image entrypoint
#   chatTemplate: true = mount the vendored Qwen jinja (reads reasoning_effort per-request)
#   extraVolumes / extraMounts: extra volumes (e.g. flash-next's /slots-save)
#
# NOTE on fork binary paths: the store hash is pinned to the current build
# (qwen4exp @0384f5c, turboq @8f2b243). If the fork is rebuilt, update the
# command: path below. These entries are disabled, so a stale path is inert.
models:
  # Gemma 4 26B-A4B (MoE, 4B active) — voice + n8n classification. --reasoning off
  # is load-bearing (thinking on triples output and breaks enum compliance).
  - name: gemma-4-26b-a4b
    enable: true
    image: ghcr.io/ggml-org/llama.cpp@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
    gpu: "1"
    port: 8555
    nixBinary: false
    args:
      - "-m"
      - "/models/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf"
      - "--alias"
      - "gemma-4-26b-a4b"
      - "-md"
      - "/models/mtp-gemma-4-26B-A4B-it-Q8_0.gguf"
      - "--spec-type"
      - "draft-mtp"
      - "--spec-draft-n-max"
      - "2"
      - "--spec-draft-p-min"
      - "0.75"
      - "-ngl"
      - "99"
      - "-c"
      - "131072"
      - "-np"
      - "1"
      - "-ub"
      - "2048"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--flash-attn"
      - "on"
      - "--jinja"
      - "--reasoning"
      - "off"
      - "--temp"
      - "0.6"
      - "--top-k"
      - "20"
      - "--top-p"
      - "0.8"
      - "--min-p"
      - "0"
    memoryRequest: 4Gi
    memoryLimit: 32Gi

  # gemma thinking variant — same weights, --reasoning on. enable: false by default;
  # enable ONE thinking mode per model at a time (two gemma pods on GPU1 won't fit).
  # (Qwen doesn't need a 2nd entry — its thinking is per-request via
  #  chat_template_kwargs.reasoning_effort, which the vendored template honours.)
  - name: gemma-4-26b-a4b-think
    enable: false
