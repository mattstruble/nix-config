      - "131072"
      - "-np"
      - "1"
      - "-ub"
      - "2048"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--flash-attn"
      - "on"
      - "--jinja"
      - "--reasoning"
      - "on"
      - "--temp"
