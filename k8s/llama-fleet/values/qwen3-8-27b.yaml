models:
  # Qwen3.8-27B — dense 27B (qwen35 arch), the "smart" coder. Runs the Indras-Mirror
  # turboq FORK. NO SWA override (it created a window that destroyed recall —
  # nix-config-qjz). q8_0 KV, MTP n-max 2, FA on, -cram 16384 (prompt-cache fix).
  # Takes 8556 (the coding endpoint) when it replaces Flash-Next.
  qwen3-8-27b:
    enable: false
    image: nvidia/cuda@sha256:af25d2ef68f7aedaf0eb179e67773e64feefc3b65a12f59a6cd604ca7c53bb57
    gpu: "0"
    port: 8556
    modelName: "qwen3.8-27b"
    nixBinary: true
    command: ["/nix/store/hcjwnnl6g6hycvm6qa17dc8nc7x8hxpp-llama-cpp-turboq-0.3.0-8f2b243/bin/llama-server"]
    chatTemplate: true
    args:
      - "-m"
      - "/models/Qwen3.8-27B-UD-Q4_K_XL.gguf"
      - "-ngl"
      - "99"
      - "-c"
      - "131072"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--jinja"
      - "--chat-template-file"
      - "/app/qwen3-chat-template.jinja"
      - "--chat-template-kwargs"
      - '{"reasoning_effort":"medium","preserve_thinking":true}'
      - "--reasoning-budget"
      - "8192"
      - "--spec-type"
      - "draft-mtp"
      - "--spec-draft-n-max"
      - "2"
      - "--spec-draft-n-min"
      - "1"
      - "-ub"
      - "1024"
      - "-np"
      - "1"
      - "--flash-attn"
      - "on"
      - "-cram"
      - "16384"
      - "--reasoning-format"
      - "deepseek"
      - "--repeat-penalty"
      - "1.0"
      - "--temp"
      - "0.6"
      - "--top-k"
      - "20"
      - "--top-p"
      - "0.8"
      - "--min-p"
      - "0"
    memoryRequest: 4Gi
    memoryLimit: 32Gi
