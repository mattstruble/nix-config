{{- /*
k3s enforces these: its embedded kube-router network-policy controller is on by
default, so they bite on stock Flannel with no Cilium or Calico.
*/ -}}
{{- /* A CIDR list is only safe if it is the shape the rules below need. An
empty list is not "no restriction" - it renders a policy that admits no
ingress at all, and the vacuum's app reads that as a dead server - so the
render refuses it rather than shipping either surprise. Entries must be
IPv4 CIDRs: the vacuum, the phone and HA are IPv4 LAN clients. */ -}}
{{- $cidrs := .Values.ingress.cidrs -}}
{{- if not $cidrs -}}
  {{- fail "ingress.cidrs must list at least one IPv4 CIDR. An empty list closes the server to every LAN client and the vacuum reads that as a dead backend. Set services.k3s.roborockIngressCidrs in nix/hosts/mjolnir/default.nix (the main LAN, plus the deadzone and HA VLANs before onboarding)." -}}
{{- end -}}
{{- $octet := `(0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])` -}}
{{- $v4cidr := (printf `^%s\.%s\.%s\.%s/(1[0-9]{2}|2[0-4][0-9]|25[0-5]|[0-9]|[1-9][0-9])$` $octet $octet $octet $octet) -}}
{{- $blocks := list -}}
{{- range $cidr := $cidrs -}}
  {{- if not (regexMatch $v4cidr $cidr) -}}
    {{- fail (printf "ingress.cidrs entry %q is not an IPv4 CIDR. LAN/VLAN ranges are IPv4; services.k3s.roborockIngressCidrs is where the list is owned." $cidr) -}}
  {{- end -}}
  {{- $blocks = append $blocks (dict "ipBlock" (dict "cidr" $cidr)) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # This document must stay first: a namespace with no policy selecting a pod
  # is DEFAULT ALLOW, so an apply that lands the workloads before the deny
  # leaves the server open to every pod in the cluster until the next pass.
  # Helm's install order puts NetworkPolicy after Namespace, and the apply
  # feeds this file to kubectl in document order.
  name: roborock-default-deny
  labels:
    app.kubernetes.io/part-of: roborock
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roborock-server
  labels:
    app.kubernetes.io/part-of: roborock
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- /*
    The LAN clients (vacuum VLAN, phones, HA), not a pod selector: this
    traffic enters through the pod's hostPorts and Flannel's portmap plugin
    preserves the source IP, so an ipBlock is the only peer shape that
    matches it. The boundary these CIDRs widen is the same one the UniFi
    firewall policies govern (RUNBOOK.md) - a client the firewall blocks
    never reaches the pod, so this list must grow when a VLAN is added there,
    not instead of it.
    */}}
    - from:
{{ $blocks | toYaml | indent 8 }}
      ports:
        - protocol: TCP
          port: {{ required "server.httpsPort is required" .Values.server.httpsPort }}
        - protocol: TCP
          port: {{ required "server.mqttTlsPort is required" .Values.server.mqttTlsPort }}
  egress:
    # DNS only to kube-dns: cert renewal resolves the ACME and Cloudflare
    # endpoints through the cluster resolver.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # TCP/443 anywhere: the two egress calls the server makes are certificate
    # renewal (acme.sh -> the ZeroSSL ACME endpoint) and the DNS-01 updates
    # (Cloudflare API). Both are anycast services whose addresses change and
    # whose hostnames kube-router cannot express in a policy, so a /32 list
    # would rot silently exactly when a renewal is due. Port-scope is the
    # containment, not destination: everything else this pod does is listen.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
