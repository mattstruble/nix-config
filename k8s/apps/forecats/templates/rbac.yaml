{{- /*
Not pruned: rbac.authorization.k8s.io Role/RoleBinding and core ServiceAccount
are not in PRUNE_ALLOWLIST in nix/services/k3s.nix, the same as the head-end's
RBAC in the ai chart. Taking this Role out of the chart leaves it in the cluster
until something removes it by hand.

The rules list below is the whole of what this Role grants, so it is the one place
a removal has to be argued in. What the shim really calls is Go, in another
directory, and no build of this chart reads it — and a Role that is one verb short
denies the claim before it has chosen a card, leaving a Job whose failure names a
403 and no file. So the verbs the claim path performs here are asserted against the
list at render time: dropping one fails the build and names the call it breaks.

What is NOT here is the eviction. A claim takes a busy card by deleting the model
Deployment that holds it, and that Deployment is in the fleet's namespace, where a
Role of this chart could never reach — the grant lives beside the fleet, in
templates/head-end-claimer-rbac.yaml of the ai chart, and is asserted there.
*/ -}}
{{- $sa := required "claim.serviceAccount: the ServiceAccount a claim runs as. nix supplies it from the same declaration the ai chart reads to bind the fleet's namespace to it, because a claimer whose Role and its subject disagree on a name is a nightly that 403s on a card it was allowed to name." .Values.claim.serviceAccount -}}
{{- $rules := list
      (dict "apiGroups" (list "batch") "resources" (list "jobs") "verbs" (list "create" "get"))
      (dict "apiGroups" (list "") "resources" (list "pods") "verbs" (list "get" "list"))
-}}
{{- $granted := dict -}}
{{- range $rule := $rules -}}
{{- range $resource := $rule.resources -}}
{{- $granted = set $granted $resource (concat (default (list) (index $granted $resource)) $rule.verbs) -}}
{{- end -}}
{{- end -}}
{{- $podVerbs := default (list) (index $granted "pods") -}}
{{- range $verb := list "get" "list" -}}
{{- if not (has $verb $podVerbs) -}}
{{- fail (printf "the %s Role does not grant %q on pods. `swapk8s claim` reads this namespace's pod list twice: the busy-card scan before it chooses a card, and awaitJobPod after the Job it creates has been accepted, while the flock is still held. Without both the claim dies on a 403 having chosen nothing, and the render never happens. templates/head-end-rbac.yaml in the ai chart grants the same two verbs for the same call, in the fleet's namespace." $sa $verb) -}}
{{- end -}}
{{- end -}}
{{- $jobVerbs := default (list) (index $granted "jobs") -}}
{{- range $verb := list "create" "get" -}}
{{- if not (has $verb $jobVerbs) -}}
{{- fail (printf "the %s Role does not grant %q on jobs. `create` is the claim putting the render Job's pod spec on the API server; `get` is the run script reading that Job back by name until it carries a terminal condition, which is how a run knows its own render failed and can claim again. Without `get` the retry has no verdict to retry on and waits out an attempt it was not allowed to start." $sa $verb) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- include "forecats.labels" . | nindent 4 }}
    app.kubernetes.io/component: nightly
# The render pod is created by this Job and runs with `automountServiceAccountToken:
# false`; nothing it does needs an identity. Only the claimer mounts one.
automountServiceAccountToken: true
---
# The claimer's privilege, in this namespace: create the render Job, read it back
# until it says how it ended, and read the pod list a claim is made of.
#
# `swapk8s claim` reads the API twice around the one thing it writes here. The
# busy-card scan GETs the pod list to learn which cards are taken (cardOwnerPods in
# src/swapk8s/main.go), and after the command it runs has created the Job,
# awaitJobPod lists the pods again under the flock to confirm a gpu-job pod carrying
# the card appeared — until that pod exists the card reads as free to the next shim,
# so the second read is not a convenience. Both are a GET on a collection with a
# label selector, which the API authorises as `list` on `pods`; the head-end makes
# the same call for the same reason and its Role grants the same two verbs
# (templates/head-end-rbac.yaml in the ai chart).
#
# No delete and no deployments/scale here: the render's own Jobs expire on their own
# TTL, a nightly that could delete is a nightly that could delete something else,
# and the one object a claim does delete is a model Deployment, which is not in this
# namespace and is granted where it is.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  labels:
    {{- include "forecats.labels" . | nindent 4 }}
    app.kubernetes.io/component: nightly
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  labels:
    {{- include "forecats.labels" . | nindent 4 }}
    app.kubernetes.io/component: nightly
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    # A RoleBinding subject is a namespaced reference written inside a string the
    # apply pass cannot fix afterwards: the render runs with no --namespace, so
    # this reads the value nix owns rather than .Release.Namespace, which would
    # answer "default" and bind the Role to a service account that does not exist.
    namespace: {{ include "forecats.namespace" . }}
roleRef:
  kind: Role
  name: {{ $sa }}
  apiGroup: rbac.authorization.k8s.io
---
