{{- /*
The nightly, and the reason it is two pods.

A card can only be pinned at the moment a container is created: the nvidia
runtime hook reads NVIDIA_VISIBLE_DEVICES then, and pinning a process already
inside a container "changes nothing the runtime can see" (runClaimed in
src/swapk8s/main.go). So the pod that makes the claim cannot be the pod that
holds the card. This one runs `swapk8s claim` — once per attempt, from the script
in templates/nightly-run-configmap.yaml — and the command the claim runs
creates the render Job from templates/render-job-configmap.yaml with the card the
shim chose substituted into it. When that command exits the shim holds the flock
for claim.podClaimWindowSeconds to confirm a gpu-job pod carrying the card
appeared; if none did, the card was never taken.

Two things this mechanism does not do, and both are properties of the shim as
built rather than choices made here:

  - The placement flock is a file, and its default is inside the head-end pod's
    own emptyDir. nightly.claimer.cardLockPath is therefore the lock of every
    claim that mounts it, and of no other pod's — including the head-end's wakes.
  - The claim scans both namespaces (`--fleet-namespace`, below), so it sees the
    card a model holds and can take it. The head-end's wake still scans only its
    own namespace — its service account has no read on pods here, and closing that
    is a grant in this namespace, not a flag — so a wake can still choose a card a
    render is holding. The render loses it to CUDA's own out-of-memory error rather
    than silently.

Closing either needs the shim to take a shared lock path and the head-end a pod
list it is not granted, not a chart that works around them.

What the claim does do is take a card rather than wait for one. When every card of
the pool is held, it deletes the Deployment of the model whose card costs least to
bring back and places on that card — whatever that model was doing, request in
flight included. The fleet's on-demand wake brings the model back and its next
request pays the cold start; the reasoning is the evictor's comment in
src/swapk8s/main.go, and the grant that makes it possible is in the ai chart.

The retry is not in this file. One line a night means the schedule cannot be the
retry, so the claimer pod loops — claim, wait for the render Job's verdict, back
off, claim again — until the panel is published or the run's deadline passes, and
that loop is templates/nightly-run-configmap.yaml. What this file owns is the
schedule, and the bound that keeps one run from overlapping the next line the
policy below forbids.
*/ -}}
{{- $nightlyName := include "forecats.nightlyName" . -}}
{{- $runDeadline := int (include "forecats.nightlyRunDeadlineSeconds" .) -}}
{{- $interval := int (include "forecats.nightlyScheduleIntervalSeconds" .) -}}
{{- $starting := int (required "nightly.startingDeadlineSeconds: how late a line may start and still be started" .Values.nightly.startingDeadlineSeconds) -}}
{{- /*
One run must finish before the next line is due. `concurrencyPolicy: Forbid` makes
a line that comes due during a run a skip rather than a queue, and with one line a
day a skip is a day without a panel — the failure this whole file is arranged to
avoid, caused by the run having been allowed to start too late. The bound is the
latest legal start plus the longest a run can take, against the interval the
schedule itself states.
*/ -}}
{{- if lt $interval (add $starting $runDeadline) -}}
{{- fail (printf "nightly.startingDeadlineSeconds (%d) plus nightly.run.deadlineSeconds (%d) is %d, and the schedule only comes round every %d. concurrencyPolicy: Forbid would then skip the next line rather than queue it, and one skipped line is a day with no panel. Lower the missed-start bound or the run deadline." $starting $runDeadline (add $starting $runDeadline) $interval) -}}
{{- end -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $nightlyName }}
  labels:
    {{- include "forecats.labels" . | nindent 4 }}
    app.kubernetes.io/component: nightly
spec:
  schedule: {{ required "nightly.schedule" .Values.nightly.schedule | quote }}
  # The zone 03:00 is in, named rather than inherited: with no timeZone the
  # schedule is read in the control plane's own zone, which is a fact about where
  # the server happens to be and not about the household whose wall this draws on.
  timeZone: {{ required "nightly.timeZone: the zone the schedule is evaluated in; nix supplies it from config.time.timeZone in nix/services/k3s.nix, because a CronJob with no timeZone is scheduled in the control plane's own zone and that is not the household's" .Values.nightly.timeZone | quote }}
  # Two claimers would take two cards for one night, and the second would find
  # the panel the first published and exit 0 having held a card for nothing.
  concurrencyPolicy: Forbid
  # Generous, because there is no second line today: a node that was down at the
  # scheduled hour should still draw today's panel when it comes back, and the
  # panel is named by date so a late one is still today's. The assertion above is
  # what keeps this from running into tomorrow's line.
  startingDeadlineSeconds: {{ $starting }}
  # Read from values, and asserted by templates/nightly-alerts.yaml: a limit of 0
  # deletes the Job whose failure the alert is about, and the alert resolves.
  successfulJobsHistoryLimit: {{ required "nightly.successfulJobsHistoryLimit" .Values.nightly.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ required "nightly.failedJobsHistoryLimit" .Values.nightly.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # One Job per line, and one pod per Job: the retry is the loop inside the pod
      # (templates/nightly-run-configmap.yaml). A pod the Job controller restarted by
      # itself would start a second loop that knows nothing about the first, and each
      # loop would keep its own run deadline — which is the bound this Job's
      # activeDeadlineSeconds below is derived from, and the one thing worth keeping
      # a bound.
      backoffLimit: 0
      ttlSecondsAfterFinished: {{ .Values.nightly.render.ttlSecondsAfterFinished }}
      # The loop stops itself a whole attempt before this; this is the backstop for
      # a loop that is not looping — an API call that never returns — and the slack
      # is the pod's termination grace plus the poll it was sleeping in.
      activeDeadlineSeconds: {{ add $runDeadline 120 }}
      template:
        metadata:
          labels:
            {{- include "forecats.labels" . | nindent 12 }}
            app.kubernetes.io/component: nightly
        spec:
          # The claimer is the API client: it creates the render Job, so it is the
          # one pod in this chart that mounts a token, and the Role below is what
          # limits it.
          serviceAccountName: forecats-nightly
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            {{- include "forecats.podSecurityContext" . | nindent 12 }}
          containers:
            - name: claim
              image: {{ required "nightly.claimer.image" .Values.nightly.claimer.image }}
              # The whole command is a script the chart ships, because the retry
              # loop is the part of the nightly a person has to read: what it does,
              # what a failed attempt costs the fleet, and which budget stops it, are
              # all in templates/nightly-run-configmap.yaml. The base image stays a
              # shell — the loop calls only the store binaries nix supplies.
              command: ["/bin/sh", "/etc/forecats/run/nightly.sh"]
              env:
                # This pod is an API client the same way the shim in it is: the
                # service-account token, the CA bundle and KUBERNETES_SERVICE_HOST
                # are put in the pod by Kubernetes, and both clients read them from
                # there. HOME is pinned to the emptyDir so no kubeconfig is looked
                # for and none is found — the fallback is the only path here, and an
                # unset HOME would make it depend on the image's user record.
                - name: HOME
                  value: /tmp
              envFrom:
                # Only for the timezone the run script's date test needs; the claim
                # itself reads no secret, and the render pod is the one that gets the
                # rest.
                - secretRef:
                    name: {{ required "secret.name: the Secret nix builds from forecatsSecret.keys" .Values.secret.name }}
              securityContext:
                {{- include "forecats.containerSecurityContext" . | nindent 16 }}
              resources:
                {{- toYaml .Values.nightly.claimer.resources | nindent 16 }}
              volumeMounts:
                {{- include "forecats.volumeMounts" (dict "ctx" $ "names" (list "nix-store" "panels") "readOnly" true) | nindent 16 }}
                # Two ConfigMaps, in two sibling directories: the script the claimer
                # runs, and the manifest the claim substitutes the card into. The
                # manifest is read by `envsubst` and the script is not, which is the
                # only reason they cannot be one ConfigMap — a `$` in the file that
                # gets substituted is a refusal, and a shell script is made of them.
                - name: run-script
                  mountPath: /etc/forecats/run
                  readOnly: true
                - name: render-job
                  mountPath: /etc/forecats/render
                  readOnly: true
          volumes:
            {{- include "forecats.volumes" . | nindent 12 }}
            - name: run-script
              configMap:
                name: forecats-nightly-run
            - name: render-job
              configMap:
                name: forecats-render-job
---
