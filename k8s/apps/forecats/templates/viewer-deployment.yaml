{{- $panels := (fromYaml (include "forecats.volumeFor" (dict "ctx" $ "name" "panels"))) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecats-viewer
  labels:
    {{- include "forecats.labels" . | nindent 4 }}
    app.kubernetes.io/component: viewer
spec:
  # Two replicas would add nothing: the panel is one PNG and one small JSON, read
  # by a household. And `Recreate` rather than a rolling update because the pod
  # holds no state a second one could disagree with.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "forecats.labels" . | nindent 6 }}
      app.kubernetes.io/component: viewer
  template:
    metadata:
      labels:
        {{- include "forecats.labels" . | nindent 8 }}
        app.kubernetes.io/component: viewer
    spec:
      # The viewer answers the panel and nothing else: no API, no database, no
      # identity.
      automountServiceAccountToken: false
      securityContext:
        {{- include "forecats.podSecurityContext" . | nindent 8 }}
      containers:
        - name: viewer
          image: {{ required "viewer.image" .Values.viewer.image }}
          command: ["python3", "/viewer/server.py"]
          env:
            # The published directory, which is the panels volume's mount point —
            # the same path the render writes, because the declaration says so once.
            - name: FORECATS_PANELS_DIRECTORY
              value: {{ $panels.mountPath | quote }}
            - name: FORECATS_INDEX_FILE
              value: /viewer/index.html
            - name: FORECATS_VIEWER_PORT
              value: {{ .Values.viewer.port | quote }}
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: {{ .Values.viewer.port }}
          # The probe reads the volume, not the page. `GET /` answers from the
          # ConfigMap the page is mounted from, so it held Ready steady through
          # every request that failed on the panels volume — and the panels are the
          # only thing this pod exists to serve. `/healthz` performs the one
          # operation a panel request performs on the volume, which is resolving a
          # name inside it: a directory the pod's uid cannot reach is NotReady, and
          # a directory nothing has been published into yet is not.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            {{- include "forecats.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.viewer.resources | nindent 12 }}
          volumeMounts:
            # Read-only on top of a volume this pod's claim would let it write: a
            # viewer that could delete the panel could delete the only copy of
            # itself, and the nightly would draw the same picture back tomorrow.
            {{- include "forecats.volumeMounts" (dict "ctx" $ "names" (list "panels") "readOnly" true) | nindent 12 }}
            - name: site
              mountPath: /viewer
              readOnly: true
      volumes:
        {{- include "forecats.volumes" . | nindent 8 }}
        - name: site
          configMap:
            name: forecats-viewer
---
