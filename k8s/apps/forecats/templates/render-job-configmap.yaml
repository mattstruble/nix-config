{{- /*
The pod spec the claim turns into a Job, as text with one hole in it.

This is a ConfigMap and not a Job because the card is not known when the chart is
rendered: it is chosen at claim time, and the pod has to carry it in its spec.
The claim substitutes ${NVIDIA_VISIBLE_DEVICES} — the shim exports the pin itself
in its own variable, and exports SWAPK8S_CARD beside it as the job name for the
shim's own attribution — and pipes the result to the API.

Two consequences of that, both deliberate:

  - `generateName` and no `name`: every attempt creates its own Job, and nothing
    has to invent a unique name in a shell. The claimer reads that generated name
    back off the create (`-o name`) because the verdict of the attempt is this
    Job's `Complete` or `Failed` condition, and the run that retries is waiting on
    it by name.
  - These Jobs are not in the apply pass's file, so the prune pass does not own
    them and does not delete them. They expire through
    `ttlSecondsAfterFinished`, which is the only cleanup that can outlive a
    chart edit.

The pod is PodSecurity `restricted`: no hostPath (which is why the three input
volumes are claims over the host directories rather than the directories),
non-root, dropped capabilities, read-only root filesystem at container level, and
/tmp as the one writable path.
*/ -}}
{{- $panels := (fromYaml (include "forecats.volumeFor" (dict "ctx" $ "name" "panels"))) -}}
{{- $pipeline := required "render.pipeline: the store path of packages.forecats-pipeline, supplied by services.k3s.forecats.pipelinePackage" .Values.render.pipeline -}}
{{- $secretName := required "secret.name: the Secret nix builds from forecatsSecret.keys" .Values.secret.name -}}
{{- $report := include "forecats.reportAddress" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: forecats-render-job
  labels:
    {{- include "forecats.labels" . | nindent 4 }}
    app.kubernetes.io/component: nightly
data:
  # The one file the claim substitutes. Nothing in it may contain a `$` other
  # than the card placeholder: envsubst runs without a shell-format argument, and
  # -no-unset turns any other `$name` into a refusal rather than an empty string.
  render-job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      generateName: {{ include "forecats.renderJobGenerateName" . }}
      labels:
        {{- include "forecats.renderLabels" . | nindent 8 }}
    spec:
      backoffLimit: {{ .Values.nightly.render.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.nightly.render.ttlSecondsAfterFinished }}
      activeDeadlineSeconds: {{ .Values.nightly.render.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "forecats.renderLabels" . | nindent 12 }}
        spec:
          # The render opens no connection to the API server: it reads mounted
          # volumes and the calendar feed, draws a picture, and writes it. A token
          # in here would be a credential for a pod whose whole job is offline.
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          # The card is pinned by NVIDIA_VISIBLE_DEVICES, but the driver library
          # is not something the image carries: libcuda.so.1 comes from the host
          # driver, injected by the nvidia container runtime for pods that opt in
          # through this class — the same opt-in every model pod makes. Without
          # it the first CUDA call dies on `libcuda.so.1: cannot open shared
          # object file` before the render draws anything.
          runtimeClassName: nvidia
          securityContext:
            # The ids the helper gives every pod in this chart: the owner of the
            # panels volume's host directory, which is what lets the render write
            # the panel without a chown init container — which the policy this
            # namespace enforces would refuse anyway.
            {{- include "forecats.podSecurityContext" . | nindent 12 }}
          containers:
            - name: render
              image: {{ required "nightly.render.image" .Values.nightly.render.image }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # The wrapper fixes the interpreter, both source trees, the
                  # household file and the overlay font as store paths, and
                  # exports the two input directories from the same storage
                  # declaration that produced the mounts below. Nothing here names
                  # a font: a pipeline that found one by looking in /usr/share is a
                  # pipeline that works until the host changes.
                  #
                  # The place is read from the environment into the flags the
                  # pipeline requires, so the coordinates reach argv at run time
                  # and never appear in this file, in a values file, or in a
                  # rendered manifest.
                  exec {{ $pipeline }}/bin/forecats-pipeline \
                    --timezone "$FORECATS_PLACE_TIMEZONE" \
                    --latitude "$FORECATS_PLACE_LATITUDE" \
                    --longitude "$FORECATS_PLACE_LONGITUDE" \
                    --output-dir '{{ $panels.mountPath }}' \
                    --renderer sd-cli{{ if .Values.nightly.drawForecastPlate }} \
                    --draw-forecast-plate{{ end }}{{ with .Values.render.sdCliBinary }} \
                    --sd-cli-binary '{{ . }}'{{ end }}
              env:
                # The card the claim chose, in the pin the nvidia runtime class
                # reads when the container is created — which is the whole reason
                # the pod is created after the claim rather than before it. The
                # shim exports it under its own name because that is the name the
                # pin already travels under; SWAPK8S_CARD beside it is the job
                # name the shim attributes the card to, not the card.
                - name: NVIDIA_VISIBLE_DEVICES
                  value: "${NVIDIA_VISIBLE_DEVICES}"
                - name: SWAPK8S_CARD
                  value: "${NVIDIA_VISIBLE_DEVICES}"
                - name: HOME
                  value: /tmp
                # The grant's report address, beside the picture it is about. The
                # pipeline refuses a publish without it and writes it into every
                # panel's provenance sidecar.
                - name: FORECATS_REPORT_ADDRESS
                  value: {{ $report | quote }}
                # The occasion researcher asks the gateway for festival props; a
                # panel that names the day plainly is the honest answer when the
                # key is absent, so the envFrom below does not carry this and the
                # name the pipeline reads is spelled out once here.
                - name: LITELLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secretName }}
                      key: FORECATS_GATEWAY_KEY
              envFrom:
                # The calendar address and the place, by name. envFrom gives the pod
                # no way to rename a key, which is why the Secret's keys are the
                # variables the pipeline reads.
                - secretRef:
                    name: {{ $secretName }}
              securityContext:
                {{- include "forecats.containerSecurityContext" . | nindent 16 }}
              resources:
                {{- toYaml .Values.nightly.render.resources | nindent 16 }}
              volumeMounts:
                {{- include "forecats.volumeMounts" (dict "ctx" $ "names" (list "panels" "weights" "photos" "nix-store")) | nindent 16 }}
          volumes:
            {{- include "forecats.volumes" . | nindent 12 }}
---
