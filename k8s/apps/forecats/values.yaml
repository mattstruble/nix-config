# Values for the forecats chart (nightly render + the panel's viewer).
#
# `namespace`, `pod.*`, `prometheus.ruleReleaseLabel`, everything under `render:`
# except the flags below, `gpu.pool`, `fleet.namespace`, everything under `claim:`
# (the window the router's wake deadline is summed from, and the identity a claim
# runs as), everything
# under `persistence:` — including each volume's owner and mode, which is what the
# uid under `pod:` is tested against — `secret.*` and `report.address` are
# deliberately absent: nix
# supplies them at render (`forecatsStorage`, `forecatsSecret`,
# `services.k3s.forecats.*` and the ai chart's `headEnd.podClaimWindowSeconds` in
# nix/services/k3s.nix), because the namespace the apply pass creates, the release
# whose Prometheus CR loads the alert rules, the uid the writable volume is owned
# by, the claim names the pre-bound PVs are matched by, the Secret's key list, the
# card pool the shim may place onto, the namespace the fleet it takes cards from
# lives in, the service account that fleet's namespace is bound to for exactly that,
# and the claim window the router's wake deadline is summed from are the same facts
# read by other software.
# `just k8s-render` and the CI preview pass the same file; a bare `helm template`
# fails the `required` guards rather than rendering defaults.
#
# No template emits `metadata.namespace`; the apply's `-n forecats` fixes it. The
# two namespaces a forecats manifest names are a PV's `claimRef` and a RoleBinding
# subject — both references the apply pass cannot repair afterwards, because they
# live inside a value that is not `metadata.namespace` — and both are values nix
# owns.
#
# The nightly's command is `packages.forecats-pipeline`'s own wrapper, reached
# through the read-only store volume. It fixes the overlay font, the interpreter
# and the two input directories as store paths at build time, so no value here
# names a font, a Python, or a model directory: a render that could not find its
# font would be a render that depended on one happening to exist.

nightly:
  # The CronJob's name. It is not decoration: kube_cronjob_status_last_successful_time
  # carries the CronJob's own name and kube_job_status_failed carries the name of
  # each Job the controller makes from it, so the two alerts in
  # templates/nightly-alerts.yaml select on this string and on nothing else. A
  # rename done here moves the CronJob and both selectors with it; a rename done
  # in one file only silences the alert.
  name: forecats-nightly
  # Kept above zero on purpose, and templates/nightly-alerts.yaml refuses a
  # render that lowers either one: kube_job_status_failed is a series over Job
  # objects, so a Job that is garbage-collected takes the evidence with it and an
  # alert that resolves on missing evidence reads as a recovery. These two limits
  # and `ttlSecondsAfterFinished` below are the whole bound on how long a failed
  # run stays visible.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Shorter than a day on purpose. A night can fail for reasons that clear
  # themselves — every card busy, a feed down, a photo not yet staged — and the
  # panel is named by date, so the first run that gets a card publishes the day
  # and every later run finds it already published and exits 0. That is the whole
  # retry story, and it is why the cadence is not `0 3 * * *`: a single 03:00 run
  # that found the fleet awake would leave yesterday's panel on the wall until
  # the next morning.
  schedule: "*/20 * * * *"
  # The claimer holds no card and runs no CUDA; it runs the shim and the API
  # client that create the pod which does both. Both are nix store binaries, so
  # the base only has to be a shell — the same pin the ai chart's tools container
  # runs its nix store binaries on.
  claimer:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    # Where the claim's placement flock lives. It is only the same lock as the
    # head-end's if the path is the same file, and the head-end's is an emptyDir
    # inside its own pod — so a claim from this pod serialises against other
    # claims that mount this path, and against nothing else. See the note in
    # templates/nightly-cronjob.yaml.
    cardLockPath: /tmp/swapk8s-cards.lock
    # How long a nightly waits for a free card before it gives up and leaves the
    # next scheduled run to try. This is not headEnd.cardWaitSeconds: that one
    # bounds a client's request and is a term of the router's wake deadline, and
    # nobody is waiting on a nightly.
    #
    # It is generous because a claim no longer waits for a card to fall idle. When
    # every card of the pool is held it takes one from the model whose card costs
    # least to bring back, whatever that model is doing, and the wait is only for
    # the flock another placement is holding and for the evicted model's pod to
    # finish dying. The night this runs out on is the one whose cards are held by
    # things a claim will not evict — another render.
    cardWaitSeconds: 3600
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  render:
    # The card renders through the CUDA runtime this image carries, and it is the
    # same pin the fleet's models serve on: the diffusion CLI is a nix store
    # binary mounted into it, and glibc comes from the store alongside.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11151@sha256:014f721265464f38ccb247c1338d07d852c4bae7509a4b4734d07a2bbadc765c
    # A render is a seed, a caption and four weight files: a retry would draw the
    # same picture, so a failed one is left failed and the next scheduled run is
    # the retry. `backoffLimit: 0` also keeps a card from being claimed again
    # under a pod that is crashlooping on a bad weight volume.
    backoffLimit: 0
    # Measured on the render host at 14.86 s for the GPU phase; the gather stages
    # in front of it are HTTP. This is the bound on a hung feed or a wedged
    # driver, not on a normal run, so it is generous by design.
    activeDeadlineSeconds: 1800
    ttlSecondsAfterFinished: 86400
    # The prefix Kubernetes puts the Job's own suffix behind. It is a value and
    # not a literal because the failure alert selects Jobs on it: a render that
    # failed is visible to Prometheus only through the name this prefix starts,
    # and a prefix edited in one of the two places it appears makes half of the
    # nightly unalertable — the claimer's Job or the render's, depending on which
    # file was edited.
    jobGenerateName: forecats-render-
    # The panel is drawn at the e-ink display's aspect; the pipeline owns the
    # size, the plate and the seed, so nothing here restates them.
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 12Gi
  # The forecast box is drawn by Pillow from the forecast the source reported,
  # not painted by the model: a number the model invented is a wrong number on
  # the wall of the house. Turning this off is a decision about the picture, not
  # a knob for a host, so it is a value and not a flag the pipeline defaults.
  drawForecastPlate: true

viewer:
  # The only thing that reads the published directory in this chart. It serves
  # four paths and nothing else — see templates/viewer-configmap.yaml for why it
  # is not `python -m http.server` over the panels volume.
  image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

ingress:
  enabled: true
  className: traefik
  # `.mjolnir` is a per-host zone answered only by the household's own resolver
  # (the wiki's note on the same record), and the node is reachable over the
  # tailnet. There is no public record for this name and no token in the path:
  # the grant's safeguard is that the panel is reachable from inside the
  # household, not that its URL is unguessable. `dig +short A forecats.mjolnir
  # @10.0.0.1` is the check that the record exists; it is outside this repo.
  host: forecats.mjolnir
  # Empty renders no `tls:` section, and traefik answers with its own
  # self-signed certificate. The wiki's cert is minted at activation from its own
  # Ingress object (nix/services/k3s.nix); that generation is wiki-specific and
  # this host is not in it yet, so the browser warning stays until it is.
  tlsSecret: ""

notice:
  # The grant's flow-down obligation, in the words a viewer sees. The panel
  # itself is drawn by the pipeline and cannot be changed from here, so this is
  # the surface beside the picture: the generator, the licence's personal-use
  # restriction, and the address a report goes to. `report.address` is not here —
  # nix supplies it, and the page refuses to render without it.
  generator: MiniMax H3
  personalUse: Generated images are licensed to the household that made them and are restricted to personal use.
  # The freshness artefact is what makes a stopped nightly visible; a panel with
  # no age beside it is a panel that cannot be trusted to be today's.
  staleAfterHours: 30
