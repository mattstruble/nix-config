models:
  gemma-4-26b-a4b:
    # Cut over 2026-10-12: first model on the swapper (the zero-blast-radius
    # choice - it was already disabled, so nothing changes for any client until
    # someone requests it). No static Deployment: the pod spec travels to the
    # head-end's spec ConfigMap and the model wakes on request. GPU 1 still
    # belongs to the resident orchestrator.
    enable: true
    lifecycle: on-demand
    # measured 2026-10-07-era loads: ~150s from pod start to serving
    coldStartSeconds: 180
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11151
    gpu: "0"   # on-demand card: GPU 1 belongs to the resident orchestrator
    port: 8555
    modelName: "gemma-4-26b-a4b"
    nixBinary: false
    args:
      - "-m"
      - "/models/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf"
      - "-md"
      - "/models/mtp-gemma-4-26B-A4B-it-Q8_0.gguf"
      - "--spec-type"
      - "draft-mtp"
      - "--spec-draft-n-max"
      - "2"
      - "--spec-draft-p-min"
      - "0.75"
      - "-ngl"
      - "99"
      - "-c"
      - "131072"
      - "-np"
      - "1"
      - "-ub"
      - "2048"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--flash-attn"
      - "on"
      - "--jinja"
      - "--reasoning"
      - "off"
      - "--temp"
      - "0.6"
      - "--top-k"
      - "20"
      - "--top-p"
      - "0.8"
      - "--min-p"
      - "0"
    memoryRequest: 4Gi
    memoryLimit: 32Gi
