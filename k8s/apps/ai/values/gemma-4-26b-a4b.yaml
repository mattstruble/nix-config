models:
  gemma-4-26b-a4b:
    # On-demand 2026-10-12, alongside the thinking variant: BOTH gemma
    # endpoints stand up on request. They are the same weights and share the
    # one swappable slot, so the exclusive group swaps them - waking either
    # evicts the other, and each wake is a full load (~80s pod-to-Ready,
    # measured with caches dropped). Reasoning is an endpoint property here,
    # not a request property (see the 2026-09-14 decision): this is the
    # NON-thinking endpoint (`--reasoning off`), for voice/classification
    # traffic that needs speakable latency and fixed-budget JSON; deliberating
    # agents belong on gemma-4-26b-a4b-think.
    #
    # coldStartSeconds: same weights, same load as the think variant - 80s
    # pod-to-Ready measured, 240 keeps it within the pod's own startupProbe
    # budget (30 x 10s), which is the real ceiling - see the swift entry for
    # why a budget larger than the probe's is incoherent.
    enable: true
    lifecycle: on-demand
    coldStartSeconds: 240
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11151@sha256:014f721265464f38ccb247c1338d07d852c4bae7509a4b4734d07a2bbadc765c
    # the CARD POOL, not a pin: placement is the shim's - it lands this model on
    # any free card in the pool at wake time, waits for one if all are busy, and
    # fails with a reason if its wait budget expires. A single-card pool ("0")
    # is still honoured, so a model CAN be pinned by declaring one card.
    gpu: "0,1"
    port: 8555
    modelName: "gemma-4-26b-a4b"
    nixBinary: false
    args:
      - "-m"
      - "/models/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf"
      - "-md"
      - "/models/mtp-gemma-4-26B-A4B-it-Q8_0.gguf"
      - "--spec-type"
      - "draft-mtp"
      - "--spec-draft-n-max"
      - "2"
      - "--spec-draft-p-min"
      - "0.75"
      - "-ngl"
      - "99"
      - "-c"
      - "131072"
      - "-np"
      - "1"
      - "-ub"
      - "2048"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--flash-attn"
      - "on"
      - "--jinja"
      - "--reasoning"
      - "off"
      - "--temp"
      - "0.6"
      - "--top-k"
      - "20"
      - "--top-p"
      - "0.8"
      - "--min-p"
      - "0"
    memoryRequest: 4Gi
    memoryLimit: 32Gi
