models:
  # Qwen3.8-Flash-Next on the Strata engine, the 2-GPU LAYER-SPLIT variant.
  #
  # DISABLED 2026-10-12, by its own benchmark gate: the multi-GPU load path does
  # not clear this host's memory ceiling. Measured live, twice, clean cards, the
  # recorded setup config (gpu [0,1], layer_split auto, --remote-expert-opt,
  # 262144 ctx): the engine starts a single-threaded CPU phase (one core at
  # 96%), host RSS climbs 41 -> 60 GB and past, VRAM stalls at 5.3 + 6.6 GB,
  # the engine dies before serving, and the server restarts it into the same
  # cycle - the log's "still starting" timestamps restart from zero. The setup
  # itself warned the exact number: "UD-IQ4_XS on several GPUs has no RAM
  # budget and needs ~118 GB of RAM... this PC has 94; the estimate is a worst
  # case (#737: a 128 GB PC ran it), but it may page or stall here". It stalls.
  # On a 128 GB host, re-enable this entry as-is: everything below is the
  # recorded, working setup output - the mint, the config, the exclusive
  # group, the placement mode - and the fleet machinery (the span group
  # unloads everything on wake, the shim applies the pool verbatim) was
  # verified live up to the load itself. Same weights, pack and MTP as the
  # 1-GPU entry; the 262144 context with KV streamed to RAM (3.6 GB).
  #
  # Client-facing name: qwen3.8-flash-next-max. Pick by job: the 1-GPU variant
  # for daily coding (it leaves a card free for a second model - the fleet's
  # tandem slots), this one for the heaviest long-context work, where having
  # the whole model in VRAM beats having a second slot.
  #
  # gpuMode: all + gpu "0,1": this model NEEDS every card in its pool. It gets
  # its own exclusive swap group (generated from gpuMode), so waking it evicts
  # the whole fleet first, and a card-wait wake that finds a card busy waits
  # for it - the swapper is adaptive in both directions.
  #
  # .strataConfig below is the recorded output of a real `setup.py --setup
  # --no-start` pass on mjolnir (2026-10-12, caches cold, both cards free):
  # --gpus 0,1 --layer-split auto --context 262144. The setup printed its
  # worst-case RAM estimate (~118 GB against 94) and proceeded - #737 ran it
  # on 128 GB; the benchmark decides whether it pages or stalls here, and the
  # exclusive group means nothing else competes for RAM while it does.
  # @BUNDLE@ (and /data) are substituted by the render; see the 1-GPU entry.
  flash-next-strata-iq4xs-2gpu:
    enable: false
    engine: strata
    nixBinary: true
    # the same digest-pinned alpine shell the 1-GPU variant runs in: the nix
    # bundle is self-contained (engine + venv + entrypoint), the image is only
    # the shell that mounts it.
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    lifecycle: on-demand
    # The fleet-killer variant does not squat both cards for half an hour:
    # a short ttl hands them back as soon as the heavy work stops.
    ttlSeconds: 900
    # Measured on the 1-GPU variant: 83-86s to serving. The layer-split load
    # reads the same shards and uploads both halves in parallel, so the same
    # budget with headroom; well within the pod's own probe budget (45x10s).
    coldStartSeconds: 300
    gpu: "0,1"
    gpuMode: all
    # container-local card list the entrypoint forwards as --gpus (see the
    # template comment); gpuIndex stays unset for a multi-card entry.
    gpus: "0,1"
    port: 8560
    modelName: "qwen3.8-flash-next-max"
    family: qwen
    # the tag the entrypoint derives: strata-ud-iq4_xs-2gpu.json (family qwen
    # has no prefix) - the recorded 2-GPU setup output, on the models PVC.
    model: UD-IQ4_XS-2GPU
    # Same memory shape as the 1-GPU variant: request tracks serving (the
    # multi-card config keeps no experts resident in RAM - they live in VRAM
    # and page from the pack - plus the streamed KV cache), and the limit
    # covers the load-time staging. The setup's ~118 GB worst-case estimate is
    # the whole model in RAM, which this pod limit deliberately refuses: the
    # benchmark decides whether it pages below that or OOMs first, and either
    # answer is the memory-ceiling gate the plan set for this variant.
    memoryRequest: 8Gi
    memoryLimit: 80Gi
    strataConfig:
      args:
        - "--pack"
        - "/data/packs/unsloth-ud-iq4_xs"
        - "--native"
        - "/data/models/unsloth-UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf"
        - "--expert-profile"
        - "@BUNDLE@/data/expert-profile.bin"
        - "--expert-cache"
        - "auto"
        - "--prefill"
        - "auto"
        - "--spec"
        - "4"
        - "--spec-min-p"
        - "0.5"
        - "--mtp"
        - "/data/mtp/rt"
        - "--max-context"
        - "262144"
        - "--kv"
        - "int8"
        - "--kv-resident"
        - "32768"
        - "--remote-expert-opt"
      cwd: "@BUNDLE@"
      tokenizer: "/data/packs/unsloth-ud-iq4_xs/tokenizer"
      model_name: "qwen3.8-flash-next-unsloth-ud-iq4_xs"
      log: "/var/log/llama.log"
      lib_dirs:
        - "/usr/local/cuda/lib64"
      port: 8560
      gpu:
        - 0
        - 1
      gpus_asked: true
      layer_split: "auto"
      host: "0.0.0.0"
