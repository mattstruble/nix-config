models:
  # Swift-Qwen3.8-27B-Q4_K_M — reasoning-efficient fine-tune of the 27B. A/B verdict
  # (2026-09-15): parity with qwen3-8-27b, NOT adopted. Kept inert so the comparison
  # can be re-run. MTP head is embedded (no -md). reasoning_effort xhigh (vendor default).
  swift-qwen3-8-27b:
    # Cut over 2026-10-12: no static Deployment; the swapper wakes it on
    # request. MEASURED 2026-10-12 with the page cache dropped before the wake:
    # 60s pod-start-to-Ready, 100s request-to-first-token - and cache-warm
    # wakes land in the same band (100-111s), so the load is compute-bound,
    # not disk-bound. The "23 minutes of weight loading" this entry used to
    # carry was planning-era lore that never survived a measurement: the pod's
    # own startupProbe budget is 30 x 10s = 300s, so a 23-minute load could
    # never have passed it. coldStartSeconds must stay within that probe
    # budget - a larger one means the pod fails and restarts before the shim
    # ever gives up on it.
    lifecycle: on-demand
    coldStartSeconds: 240
    enable: true
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11151
    # the CARD POOL, not a pin: placement is the shim's - it lands this model on
    # any free card in the pool at wake time, waits for one if all are busy, and
    # fails with a reason if its wait budget expires. A single-card pool ("0")
    # is still honoured, so a model CAN be pinned by declaring one card.
    gpu: "0,1"
    port: 8556
    modelName: "swift-qwen3.8-27b"
    nixBinary: false
    chatTemplate: true
    args:
      - "-m"
      - "/models/Swift-Qwen3.8-27B-Q4_K_M.gguf"
      - "-ngl"
      - "99"
      - "-c"
      - "131072"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--jinja"
      - "--chat-template-file"
      - "/app/qwen3-chat-template.jinja"
      - "--chat-template-kwargs"
      - '{"reasoning_effort":"xhigh","preserve_thinking":true}'
      - "--reasoning-budget"
      - "8192"
      - "--reasoning-format"
      - "deepseek"
      - "--spec-type"
      - "draft-mtp"
      - "--spec-draft-n-max"
      - "2"
      - "--spec-draft-n-min"
      - "1"
      - "-ub"
      - "1024"
      - "-np"
      - "1"
      - "--flash-attn"
      - "on"
      - "-cram"
      - "16384"
      - "--repeat-penalty"
      - "1.0"
      - "--temp"
      - "0.6"
      - "--top-k"
      - "20"
      - "--top-p"
      - "0.8"
      - "--min-p"
      - "0"
    # Measured 2026-10-12: steady state is 7.5 GiB (RssAnon 6.83) once the first request
    # completes and the host copy of the weights is released. The 32Gi limit was touched
    # exactly (memory.peak == memory.max) during model load, while the GGUF is staged in
    # anonymous host memory on the way to VRAM - that is the OOM, not a leak (idle sampling
    # is flat). So: request tracks serving, limit tracks the cold-start peak.
    memoryRequest: 8Gi
    memoryLimit: 40Gi
