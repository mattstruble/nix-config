models:
  # Swift-Qwen3.8-27B-Q4_K_M — reasoning-efficient fine-tune of the 27B. A/B verdict
  # (2026-09-15): parity with qwen3-8-27b, NOT adopted. Kept inert so the comparison
  # can be re-run. MTP head is embedded (no -md). reasoning_effort xhigh (vendor default).
  swift-qwen3-8-27b:
    # Cut over 2026-10-12: no static Deployment; the swapper wakes it on
    # request. 23 minutes of weight loading off the models PVC is the honest
    # number - the shim's readiness budget and llama-swap's healthCheckTimeout
    # both derive from it, so a client that will not wait that long should not
    # ask for this model.
    lifecycle: on-demand
    coldStartSeconds: 1500
    enable: true
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11151
    gpu: "0"
    port: 8556
    modelName: "swift-qwen3.8-27b"
    nixBinary: false
    chatTemplate: true
    args:
      - "-m"
      - "/models/Swift-Qwen3.8-27B-Q4_K_M.gguf"
      - "-ngl"
      - "99"
      - "-c"
      - "131072"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--jinja"
      - "--chat-template-file"
      - "/app/qwen3-chat-template.jinja"
      - "--chat-template-kwargs"
      - '{"reasoning_effort":"xhigh","preserve_thinking":true}'
      - "--reasoning-budget"
      - "8192"
      - "--reasoning-format"
      - "deepseek"
      - "--spec-type"
      - "draft-mtp"
      - "--spec-draft-n-max"
      - "2"
      - "--spec-draft-n-min"
      - "1"
      - "-ub"
      - "1024"
      - "-np"
      - "1"
      - "--flash-attn"
      - "on"
      - "-cram"
      - "16384"
      - "--repeat-penalty"
      - "1.0"
      - "--temp"
      - "0.6"
      - "--top-k"
      - "20"
      - "--top-p"
      - "0.8"
      - "--min-p"
      - "0"
    # Measured 2026-10-12: steady state is 7.5 GiB (RssAnon 6.83) once the first request
    # completes and the host copy of the weights is released. The 32Gi limit was touched
    # exactly (memory.peak == memory.max) during model load, while the GGUF is staged in
    # anonymous host memory on the way to VRAM - that is the OOM, not a leak (idle sampling
    # is flat). So: request tracks serving, limit tracks the cold-start peak.
    memoryRequest: 8Gi
    memoryLimit: 40Gi
