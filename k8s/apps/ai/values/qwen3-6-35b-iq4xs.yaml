models:
  # Qwen3.6-35B-A3B MoE — dispatch/chat/HA/n8n (speed-primary). FA off (hybrid SSM
  # fattn path broken in this build), q8_0 K + f16 V KV, -np 2 (128k per user),
  # no MTP (draft path O(n) at length). Uses the vendored template.
  qwen3-6-35b-iq4xs:
    enable: false
    image: ghcr.io/ggml-org/llama.cpp@sha256:41ebf873c2e085dcc3186dc4717ce8112bf8011aabd98038b6bb2b1fe66c86b9
    gpu: "1"
    port: 8555
    modelName: "Qwen3.6-35B-A3B"
    nixBinary: false
    chatTemplate: true
    args:
      - "-m"
      - "/models/Qwen3.6-35B-A3B-MTP-UD-IQ4_XS.gguf"
      - "-ngl"
      - "99"
      - "-c"
      - "262144"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "f16"
      - "--jinja"
      - "--chat-template-file"
      - "/app/qwen3-chat-template.jinja"
      - "--chat-template-kwargs"
      - '{"reasoning_effort":"medium","preserve_thinking":true}'
      - "--reasoning-budget"
      - "8192"
      - "-ub"
      - "256"
      - "-np"
      - "2"
      - "--flash-attn"
      - "off"
      - "--temp"
      - "0.8"
      - "--top-k"
      - "40"
      - "--top-p"
      - "0.95"
      - "--min-p"
      - "0"
    memoryRequest: 4Gi
    memoryLimit: 32Gi
