{{- /*
The Strata engine's install config, in git instead of hand-edited on the PVC.

setup.py records the config it built into $STRATA_DATA/config/strata-<tag>.json
and the entrypoint starts that file; it is the recorded output of a setup pass
(the pack, the profile, the quant, the KV decision), not something the
entrypoint can rebuild from env vars. Ours was produced by one setup pass on
mjolnir and then edited by hand - the PVC still held
strata-ud-iq4_xs.json.bak-b1ixiy next to it - so the running model's real
settings existed only on a volume, with no diff and no review.

This ConfigMap is mounted over /data/config/strata-<tag>.json, so git is the
source of truth and the PVC copy is just where the setup pass left it.

Two things to know before changing anything here:
  - exe / cwd / --expert-profile embed the bundle's /nix/store path. They are
    rendered from the bundle path (see the ai.strataBundle helper), so bumping
    the bundle moves them automatically -
    which is the point, because by hand they silently keep pointing at the old
    bundle.
  - api_key is deliberately empty. The real key comes from the litellm-keys
    Secret (the bundle entrypoint forwards the pod's API_KEY as --api-key, and
    setup.py lets the CLI override the config). A key in this file would be a
    second, unmanaged one.
*/ -}}
{{- range $name, $m := .Values.models }}
{{- if and $m.enable (eq $m.engine "strata") }}
{{- $family := $m.family | default "qwen" }}
{{- $prefix := (eq $family "qwen") | ternary "" (printf "%s-" $family) }}
{{- $tag := printf "%s%s" $prefix (lower $m.model) }}
{{- $cfg := deepCopy $m.strataConfig }}
{{- $bundle := include "ai.strataBundle" (dict "root" $ "m" $m "name" $name) }}
{{- /* @BUNDLE@ in args is the bundle path, so the config cannot keep pointing
     at a bundle that no longer exists. */}}
{{- $args := list }}
{{- range $a := $cfg.args }}
{{- $args = append $args (replace "@BUNDLE@" $bundle $a) }}
{{- end }}
{{- $_ := set $cfg "args" $args }}
{{- $_ := set $cfg "exe" (printf "%s/bin/strata" $bundle) }}
{{- $_ := set $cfg "cwd" $bundle }}
{{- $_ := set $cfg "port" (int $m.port) }}
{{- $_ := set $cfg "gpu" (int $m.gpuIndex) }}
{{- $_ := set $cfg "api_key" "" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-strata-config
  labels:
    app.kubernetes.io/part-of: ai
data:
  strata-{{ $tag }}.json: {{ toJson $cfg | quote }}
{{- end }}
{{- end }}
