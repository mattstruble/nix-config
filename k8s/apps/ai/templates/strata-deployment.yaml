{{/*
Strata models with a static lifecycle: the Deployment is in the manifest, so
applying it owns the replica count. On-demand strata models render no
Deployment here; their spec travels to the swapper in the head-end's spec
ConfigMap (head-end-specs-configmap.yaml), routed by engine - the same engine
switch that picks this template for the static path.
*/}}
{{- range $name, $m := .Values.models }}
{{- if and $m.enable (eq ($m.engine | default "llama") "strata") (eq ($m.lifecycle | default "static") "static") }}
{{- include "ai.strataDeployment" (dict "name" $name "m" $m "root" $) }}
---
{{- end }}
{{- end }}
