{{- if .Values.gateway.enable }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels:
    app.kubernetes.io/part-of: ai
data:
  config.yaml: |
    model_list:
      {{- range $name, $m := .Values.models }}
      {{- if $m.enable }}
      - model_name: {{ $m.modelName }}
        litellm_params:
          model: openai/{{ $m.modelName }}
          api_base: http://{{ $name }}.default.svc.cluster.local:{{ $m.port }}/v1
          # env expansion: the gateway's OPENAI_API_KEY comes from the
          # litellm-keys Secret (see gateway-deployment).
          api_key: os.environ/OPENAI_API_KEY # pragma: allowlist secret
      {{- end }}
      {{- end }}
    # Prometheus metrics at /metrics (pre-installed in the image).
    litellm_settings:
      callbacks:
        - prometheus
      # ClusterIP-only endpoint; the ServiceMonitor scrapes without a gateway key.
      require_auth_for_metrics_endpoint: false
      # The api_key_alias label is emitted by default on the request/token
      # metrics; it carries the calling key's alias (pi, opencode, ...) so the
      # dashboard can break down requests/tokens per source. Requires per-source
      # keys minted with a key_alias (just mint-key <name>).
---
{{- end }}
