{{- if .Values.gateway.enable }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels:
    app.kubernetes.io/part-of: ai
data:
  config.yaml: |
    model_list:
      {{- range $name, $m := .Values.models }}
      {{- if $m.enable }}
      - model_name: {{ $m.modelName }}
        litellm_params:
          {{- if eq ($m.lifecycle | default "static") "on-demand" }}
          # Summoned through the head-end. llama-swap's roster is keyed by the
          # Deployment name, so that is the name the upstream call carries; the
          # model_name above stays whatever clients type. The per-model Service
          # keeps existing - the woken pod selects on it - this only changes who
          # answers when the pod is not up yet.
          model: openai/{{ $name }}
          api_base: http://swap-head-end.default.svc.cluster.local:{{ $.Values.headEnd.port }}/v1
          {{- else }}
          model: openai/{{ $m.modelName }}
          api_base: http://{{ $name }}.default.svc.cluster.local:{{ $m.port }}/v1
          {{- end }}
          # env expansion: the gateway's OPENAI_API_KEY comes from the
          # litellm-keys Secret (see gateway-deployment).
          api_key: os.environ/OPENAI_API_KEY # pragma: allowlist secret
      {{- end }}
      {{- end }}
    # Prometheus metrics at /metrics (pre-installed in the image).
    litellm_settings:
      # Cross-model fallback. A model route whose pod is down (rollout, GPU
      # window, crash) otherwise errors every client of that route; with a
      # fallback the router cools the dead deployment and retries elsewhere.
      # Mechanism only - no model sets fallbackTo today, so this renders [] and
      # changes nothing. Enabling it is a policy call, not a config detail: the
      # fallback answers from a DIFFERENT model, so a strata outage would
      # silently serve swift-qwen3-8-27b (27B Q4_K_M, -c 131072) to clients that
      # asked for qwen3.8-flash-next (262144 ctx). Prompts over 128k still fail,
      # just later. Decide per window, not permanently.
      # Needs a gateway restart to take effect - routes are not hot-reloaded.
      {{- $fallbacks := list }}
      {{- range $name, $m := .Values.models }}
      {{- if and $m.enable $m.fallbackTo }}
      {{- $fallbacks = append $fallbacks (dict $m.modelName $m.fallbackTo) }}
      {{- end }}
      {{- end }}
      fallbacks: {{ toYaml $fallbacks | nindent 8 }}
      callbacks:
        - prometheus
      # The litellm ServiceMonitor presents the dedicated metrics key
      # (litellm-metrics-key Secret, mounted into Prometheus; see the kps
      # values) — the hostPort 8000 endpoint is LAN-reachable, so the
      # endpoint must not serve spend/token/latency unauthenticated.
      require_auth_for_metrics_endpoint: true
      # The api_key_alias label is emitted by default on the request/token
      # metrics; it carries the calling key's alias (pi, opencode, ...) so the
      # dashboard can break down requests/tokens per source. Requires per-source
      # keys minted with a key_alias (just mint-key <name>).
---
{{- end }}
