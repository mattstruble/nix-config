{{- if .Values.gateway.enable }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels:
    app.kubernetes.io/part-of: ai
data:
  config.yaml: |
    model_list:
      {{- range $name, $m := .Values.models }}
      {{- if $m.enable }}
      - model_name: {{ $m.modelName }}
        litellm_params:
          model: openai/{{ $m.modelName }}
          api_base: http://{{ $name }}.default.svc.cluster.local:{{ $m.port }}/v1
          api_key: {{ $.Values.gateway.podApiKey }}
      {{- end }}
      {{- end }}
    # Prometheus metrics at /metrics (pre-installed in the image).
    litellm_settings:
      callbacks:
        - prometheus
      # ClusterIP-only endpoint; the ServiceMonitor scrapes without a gateway key.
      require_auth_for_metrics_endpoint: false
      # Label every metric with the calling key's alias (pi, opencode, ...) so
      # the dashboard can break down requests/tokens per source. Requires
      # per-source keys minted with an alias (just mint-key <name>).
      prometheus_label_config:
        - user_api_key_alias
---
{{- end }}
