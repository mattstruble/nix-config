{{- range $name, $m := .Values.models }}
{{- if $m.enable }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: ai
    app.kubernetes.io/component: model
spec:
  selector:
    app: {{ $name }}
  ports:
    # named so the kps ServiceMonitor (port: http) can reference it
    - name: http
      port: {{ $m.port }}
      targetPort: {{ $m.port }}
---
{{- end }}
{{- end }}
