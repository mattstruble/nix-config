{{/*
Models with a static lifecycle: the Deployment is in the manifest, so applying
the manifest owns its replica count. On-demand models render no Deployment here;
their spec travels to the swapper in the head-end's spec ConfigMap
(head-end-specs-configmap.yaml), which is what stops every `kubectl apply` from
scaling a summoned model back to zero.
*/}}
{{- range $name, $m := .Values.models }}
{{- if and $m.enable (ne ($m.engine | default "llama") "strata") (eq ($m.lifecycle | default "static") "static") }}
{{- include "ai.modelDeployment" (dict "name" $name "m" $m "root" $) }}
---
{{- end }}
{{- end }}
