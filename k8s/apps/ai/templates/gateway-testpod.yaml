{{- if .Values.gateway.testPod }}
# Throwaway gateway with the NEW config (master key + Postgres DB + per-source
# label), on :8001, sharing the same Postgres as prod. Used to validate key
# minting + the prometheus label BEFORE flipping usePostgresKeys on prod.
# Delete by setting gateway.testPod=false (helm/kubectl apply prunes it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-test
  labels:
    app: litellm-test
    app.kubernetes.io/part-of: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm-test
  template:
    metadata:
      labels:
        app: litellm-test
        app.kubernetes.io/part-of: ai
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      automountServiceAccountToken: false
      containers:
        - name: litellm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          image: {{ .Values.gateway.image }}
          args: ["--config", "/app/proxy_server_config.yaml"]
          ports:
            - containerPort: 4000
              hostPort: 8001
          env:
            - name: OPENAI_API_KEY
              value: {{ .Values.gateway.podApiKey | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-keys
                  key: database-url
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-keys
                  key: master-key
          volumeMounts:
            - name: config
              mountPath: /app/proxy_server_config.yaml
              subPath: config.yaml
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: config
          configMap:
            name: litellm-config
{{- end }}
