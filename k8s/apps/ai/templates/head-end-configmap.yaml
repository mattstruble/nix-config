{{- if and .Values.headEnd.enable (not (empty .Values.headEnd.bundle)) }}
{{- $h := .Values.headEnd }}
{{- $summonable := dict }}
{{- $maxCold := $h.coldStartSeconds }}
{{- range $name, $m := .Values.models }}
  {{- if and $m.enable (eq ($m.lifecycle | default "static") "on-demand") }}
    {{- $_ := set $summonable $name $m }}
    {{- $cs := $m.coldStartSeconds | default $h.coldStartSeconds }}
    {{- if gt $cs $maxCold }}{{ $maxCold = $cs }}{{ end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  labels:
    app.kubernetes.io/part-of: ai
    app.kubernetes.io/component: model-swapper
data:
  # llama-swap's roster, generated from the same values that render the model
  # pods. A model joins it by declaring `lifecycle: on-demand`; nothing is added
  # by hand, so the roster cannot claim a model the chart cannot render.
  #
  # The shape follows llama-swap's own config format, which the first cut of
  # this file got wrong and --validate caught before anything ran: `models:` is
  # a MAP keyed by model ID (not a list of entries), exclusivity lives in a
  # separate top-level `groups:` map, and `healthCheckTimeout` is global — so
  # the readiness budget is the MAXIMUM cold start in the roster, not a
  # per-model value. A model that cannot wait out the slowest model's wake
  # should not share its budget; on this fleet that is 25 minutes of swift
  # weight loading, and any client that will not wait that long should not ask.
  config.yaml: |
    # ${PORT} appears in both cmd and proxy: llama-swap refuses a config where
    # proxy allocates a port that cmd never binds (validation error, and the
    # first spike's reload failed exactly this way).
    listen: "0.0.0.0:{{ $h.port }}"
    healthCheckTimeout: {{ $maxCold }}
    # Owner decision 2026-10-12: stream loading state. While a model wakes,
    # clients see the reasoning field fill with loading remarks instead of a
    # silent held connection. The trade was recorded when it was made: once the
    # loading stream opens, HTTP 200 is already committed, so a model that
    # fails to come up is reported in-band inside a 200 stream - the client
    # must read the error frame, not the status code.
    sendLoadingState: true
    groups:
      # ONE GROUP PER CARD, exclusive: false. A group is llama-swap's swap
      # boundary: members of the same group evict each other, so one group per
      # card means one model per card at a time; exclusive: false lets
      # DIFFERENT groups run together, so the slot count is exactly the card
      # count - two models in tandem, one per card. Cross-card safety is the
      # group split itself: same-card models are serialised within their
      # group, different-card models coexist (measured: both cards loaded
      # leaves 37-39 GiB host RAM free).
      #
      # exclusive: false is the deliberate reversal of the first cut's one
      # host-wide exclusive group, which serialised every cold start for RAM
      # safety while nothing was measured. The one unmeasured case is two loads
      # at once - which per-card groups now make possible, on purpose, to
      # measure rather than forbid. If it ever OOMs the node, the fix is
      # exclusive: true on one group, not unsplitting the groups.
      #
      # INTERIM: groups are generated from each model's `gpu:` value, so the
      # roster is still card-pinned. The destination is dynamic placement -
      # the shim picks a free card at wake - at which point these collapse
      # into one non-swapping group and models stop declaring a card. Do not
      # build anything on these group names.
      {{- $groups := dict }}
      {{- range $name, $m := $summonable }}
        {{- $k := printf "gpu-%s" ($m.gpu | toString) }}
        {{- $list := index $groups $k | default list }}
        {{- $_ := set $groups $k (append $list $name) }}
      {{- end }}
      {{- range $gname, $members := $groups }}
      {{ $gname }}:
        swap: true
        exclusive: false
        members:
          {{- range $members }}
          - {{ . }}
          {{- end }}
      {{- end }}
    models:
      {{- range $name, $m := $summonable }}
      {{ $name }}:
        # Idle time before the model goes back to sleep. Falls back to
        # headEnd.ttlSeconds; 0 would mean llama-swap's GlobalTTL default, which
        # is off - and the fleet's whole point is that idle models do not hold
        # GPUs. (This line was dropped once, in the list-form to map-form
        # rewrite, and nothing slept for an hour before anyone noticed: the
        # symptom of a missing ttl is a model that never unloads.)
        ttl: {{ $m.ttlSeconds | default $h.ttlSeconds }}
        # A wake is a request that waits, so the shim's readiness budget is
        # that model's own measured cold start - not one global constant that
        # has to be the maximum of every model on the box (that maximum is
        # healthCheckTimeout's job, above).
        cmd: >-
          {{ $h.bundle }}/bin/swapk8s serve
          --model {{ $name }}
          --port {{ $m.port }}
          --listen 127.0.0.1:${PORT}
          --health-path {{ $h.healthPath }}
          --spec-dir /etc/swapk8s/specs
          --startup-timeout {{ $m.coldStartSeconds | default $h.coldStartSeconds }}s
        # ${PID} is llama-swap substituting the serve process's pid into the
        # stop command. cmdStop owns the whole stop, process included: llama-swap
        # runs this and returns without touching the process tree, so if this
        # did not kill the serve process it would linger in its
        # not-ready-forever loop, the process handle would never close, and the
        # exclusive group would never free - which is the second bug this
        # cluster found the hard way.
        cmdStop: >-
          {{ $h.bundle }}/bin/swapk8s stop
          --model {{ $name }}
          --pid ${PID}
        # proxy is the bare host, no path: llama-swap APPENDS the incoming
        # request path to this value (internal/process uses Go's
        # NewSingleHostReverseProxy, which prepends the proxy path), so /v1 here
        # would become /v1/v1/chat/completions at the backend - the first wake
        # 404'd exactly that way. The incoming /v1/... from clients carries the
        # prefix on its own.
        proxy: http://127.0.0.1:${PORT}
      {{- end }}
---
{{- end }}
