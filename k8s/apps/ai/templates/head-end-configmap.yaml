{{- if and .Values.headEnd.enable (not (empty .Values.headEnd.bundle)) }}
{{- $h := .Values.headEnd }}
{{- $summonable := dict }}
{{- $cardWait := int64 ($h.cardWaitSeconds | default 300) }}
{{- $claim := int64 (required "headEnd.podClaimWindowSeconds: the window a wake holds its card for the scale to produce a pod. It is a term of healthCheckTimeout and of the shim's claim window below, so a render without it budgets a wake the router does not cover" $h.podClaimWindowSeconds) }}
{{- $maxCold := int64 $h.coldStartSeconds }}
{{- $slowest := int64 0 }}
{{- $slowestName := "" }}
{{- range $name, $m := .Values.models }}
  {{- if and $m.enable (eq ($m.lifecycle | default "static") "on-demand") }}
    {{- $_ := set $summonable $name $m }}
    {{- $cs := int64 ($m.coldStartSeconds | default $h.coldStartSeconds) }}
    {{- if gt $cs $maxCold }}{{ $maxCold = $cs }}{{ end }}
    {{- if gt $cs $slowest }}{{ $slowest = $cs }}{{ $slowestName = $name }}{{ end }}
  {{- end }}
{{- end }}
{{- /*
The deadline llama-swap holds every wake to, and the worst wake the roster can
ask for, written out twice on purpose: the guard is the wake as the shim runs it,
and that is what catches a deadline whose sum has lost a term - the edit that
puts a model to sleep mid-wake is invisible to a guard that reuses the sum.
*/}}
{{- $deadline := add (add $cardWait $claim) $maxCold }}
{{- $worstWake := add (add $cardWait $claim) $slowest }}
{{- if not (lt $worstWake $deadline) }}
  {{- fail (printf "model %s wakes in %ds (card wait %d + claim window %d + load %d) and the router's deadline is %ds: llama-swap sets that deadline once and its abort runs cmdStop, so the model is scaled to zero as it becomes Ready. The deadline is the same sum taken at headEnd.coldStartSeconds (%d) - the budget for a model nobody measured, and the deadline's only slack - so this model needs a measured coldStartSeconds under %d, or headEnd.coldStartSeconds needs above it." $slowestName $worstWake $cardWait $claim $slowest $deadline $maxCold $maxCold) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  labels:
    app.kubernetes.io/part-of: ai
    app.kubernetes.io/component: model-swapper
data:
  # llama-swap's roster, generated from the same values that render the model
  # pods. A model joins it by declaring `lifecycle: on-demand`; nothing is added
  # by hand, so the roster cannot claim a model the chart cannot render.
  #
  # The shape follows llama-swap's own config format, which the first cut of
  # this file got wrong and --validate caught before anything ran: `models:` is
  # a MAP keyed by model ID (not a list of entries), exclusivity lives in a
  # separate top-level `groups:` map, and `healthCheckTimeout` is global — so one
  # deadline bounds every model's wake and it is the widest wake in the roster,
  # not a per-model value. A client that will not wait out the slowest model
  # should not ask for any of them.
  config.yaml: |
    # ${PORT} appears in both cmd and proxy: llama-swap refuses a config where
    # proxy allocates a port that cmd never binds (validation error, and the
    # first spike's reload failed exactly this way).
    #
    # No listen key: llama-swap's config struct has no listen field and its
    # decoder ignores unknown keys, so nothing written here can move the
    # listener - head-end-deployment.yaml's --listen flag is what binds it.
    #
    # The whole wake, not the load: this is cardWaitSeconds +
    # podClaimWindowSeconds + the cold-load budget of the roster. In the pinned
    # llama-swap doStart sets this deadline once and only moves it when the health
    # body reports loading progress; the shim answers not-ready with a reason,
    # which that parser rejects, and the health endpoint does not exist until the
    # pod is up - so every second of a wake counts here, and on expiry the abort
    # runs cmdStop and a model seconds from Ready goes back to sleep. A render
    # whose slowest wake reaches this number refuses to render; what a green render
    # does not claim is that the cold starts still match what the host measured.
    healthCheckTimeout: {{ $deadline }}
    # Owner decision 2026-10-12: stream loading state. While a model wakes,
    # clients see the reasoning field fill with loading remarks instead of a
    # silent held connection. The trade was recorded when it was made: once the
    # loading stream opens, HTTP 200 is already committed, so a model that
    # fails to come up is reported in-band inside a 200 stream - the client
    # must read the error frame, not the status code.
    sendLoadingState: true
    groups:
      # PLACEMENT IS THE SHIM'S, so the group structure no longer expresses
      # cards at all. One `anywhere` group, swap: false: members never evict
      # each other, because coexistence is the shim's to arbitrate - it lands
      # each wake on a free card and WAITS when every card is busy. The
      # per-card groups this replaced were the interim while models were
      # pinned in values; with pools in values and placement in the shim they
      # are gone, and their one job (never two models on one card) moved to
      # the shim's busy-card scan under the placement flock.
      #
      # A model that needs EVERY card in its pool (gpuMode: all - the
      # 2-GPU-spanning strata variant) gets its own group, swap: true +
      # exclusive: true: loading one unloads every other group, which is
      # exactly "the fleet must be asleep for this model to run". The reverse
      # direction - a single-card wake onto a card a spanning model holds - is
      # the shim's wait-for-free-card, not the group router's (it has no
      # resource awareness; that gap is why placement lives in the shim).
      {{- $any := list }}
      {{- $spans := dict }}
      {{- range $name, $m := $summonable }}
        {{- if eq ($m.gpuMode | default "any") "all" }}
          {{- $k := printf "span-%s" (replace "," "-" ($m.gpu | toString)) }}
          {{- $list := index $spans $k | default list }}
          {{- $_ := set $spans $k (append $list $name) }}
        {{- else }}
          {{- $any = append $any $name }}
        {{- end }}
      {{- end }}
      {{- if $any }}
      anywhere:
        swap: false
        exclusive: false
        members:
          {{- range $any }}
          - {{ . }}
          {{- end }}
      {{- end }}
      {{- range $gname, $members := $spans }}
      {{ $gname }}:
        swap: true
        exclusive: true
        members:
          {{- range $members }}
          - {{ . }}
          {{- end }}
      {{- end }}
    models:
      {{- range $name, $m := $summonable }}
      {{- $idle := $m.ttlSeconds | default $h.ttlSeconds }}
      {{- $cold := int64 ($m.coldStartSeconds | default $h.coldStartSeconds) }}
      {{- $cost := $m.reclaimCostSeconds }}
      {{- if ne $cost nil }}
      {{- if gt (int64 $cost) (int64 $idle) }}
      {{- fail (printf "model %s: reclaimCostSeconds %d is larger than its own idle budget %d - reclaiming that card then costs more than waiting out the ttl that frees it by itself, so the figure is not a reclaim cost" $name (int64 $cost) (int64 $idle)) }}
      {{- end }}
      {{- end }}
      {{ $name }}:
        # Idle time before the model goes back to sleep. Falls back to
        # headEnd.ttlSeconds; 0 would mean llama-swap's GlobalTTL default, which
        # is off - and the fleet's whole point is that idle models do not hold
        # GPUs. (This line was dropped once, in the list-form to map-form
        # rewrite, and nothing slept for an hour before anyone noticed: the
        # symptom of a missing ttl is a model that never unloads.)
        ttl: {{ $idle }}
        {{- if ne $cost nil }}
        # A measurement this host took, recorded ahead of the consumer that does
        # not exist yet: what reclaiming this card costs whoever loses it - the
        # measured cold start plus the re-prefill of the session the eviction
        # destroys. llama-swap v264 has no such field and its decoder ignores
        # unknown keys, so this line changes nothing about how the router runs;
        # the reclaim scheduler that would rank by it is unwritten. Emitted only
        # where this host measured one - an absent cost is not a free reclaim.
        reclaimCostSeconds: {{ int64 $cost }}
        {{- end }}
        # A wake is a request that waits, so the shim's readiness budget is
        # that model's own measured cold start - not one global constant that
        # has to be the maximum of every model on the box (that maximum is
        # healthCheckTimeout's job, above). The two waits on this same cmd are
        # the other terms of that deadline, which is why the claim window is
        # rendered rather than defaulted inside the shim: a window the sum does
        # not carry is a wake the router aborts.
        cmd: >-
          {{ $h.bundle }}/bin/swapk8s serve
          --model {{ $name }}
          --port {{ $m.port }}
          --listen 127.0.0.1:${PORT}
          --health-path {{ $h.healthPath }}
          --spec-dir /etc/swapk8s/specs
          --startup-timeout {{ $cold }}s
          --card-wait {{ $cardWait }}s
          --pod-claim-window {{ $claim }}s
        # ${PID} is llama-swap substituting the serve process's pid into the
        # stop command. cmdStop owns the whole stop, process included: llama-swap
        # runs this and returns without touching the process tree, so if this
        # did not kill the serve process it would linger in its
        # not-ready-forever loop, the process handle would never close, and the
        # exclusive group would never free - which is the second bug this
        # cluster found the hard way.
        cmdStop: >-
          {{ $h.bundle }}/bin/swapk8s stop
          --model {{ $name }}
          --pid ${PID}
        # proxy is the bare host, no path: llama-swap APPENDS the incoming
        # request path to this value (internal/process uses Go's
        # NewSingleHostReverseProxy, which prepends the proxy path), so /v1 here
        # would become /v1/v1/chat/completions at the backend - the first wake
        # 404'd exactly that way. The incoming /v1/... from clients carries the
        # prefix on its own.
        proxy: http://127.0.0.1:${PORT}
      {{- end }}
---
{{- end }}
