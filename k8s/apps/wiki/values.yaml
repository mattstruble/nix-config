# Values for the wiki chart (BookStack + MariaDB, namespace `wiki`).
#
# Images follow the repo-wide `repository:tag@digest` convention
# (k8s/README.md); Renovate bumps the tag and the digest job rehashes it, so
# a BookStack security release is a one-line diff rather than an SSH session.
#
# BookStack is pinned to a LinuxServer image rather than upstream because
# upstream publishes no container image at all — its own docs point at
# LinuxServer or solidnerd. That choice has a price, and it is recorded in
# the pod's securityContext below rather than glossed over.

namespace: wiki

bookstack:
  # ghcr.io rather than lscr.io for the same bytes: ghcr speaks the registry
  # auth flow scripts/resolve-digest.sh (and Renovate) can authenticate to.
  image: ghcr.io/linuxserver/bookstack:v26.09.2-ls293@sha256:2fdeeb1a2028ce7cb1274696237e32b9f849e16b6d77314d08c78356a6016fca
  # What users type, what BookStack puts in every redirect and in the
  # absolute URLs it stores for images. Changing it later needs
  # `php artisan bookstack:update-url`, not just a value bump.
  appUrl: https://wiki.struble.app
  # The unprivileged user the app actually runs as after s6 init. 983 is
  # unassigned on mjolnir; the host directory is pre-owned by it (see
  # persistence.hostPath) because the cluster's non-root stance forbids a
  # root chown initContainer.
  uid: 983
  gid: 983
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

database:
  image: mariadb:11@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
  # The mariadb image's own user. Pre-owned host dir, same reasoning as above.
  uid: 999
  gid: 999
  port: 3306
  database: bookstack
  username: bookstack
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

# The Secret this chart REFERENCES and never creates. Keys are the container's
# own env var names, because that is what the pod reads; who creates it is
# nix/services/k3s.nix (see SECRETS.md for the contract).
# The allowlist pragma is for the word "secret" in a key whose value is a
# fixed name, not a credential — no secret value ever appears in this file.
secretName: bookstack # pragma: allowlist secret

oidc:
  # BookStack fetches <issuer>/.well-known/openid-configuration from inside
  # its own pod, so this must be reachable from the cluster — the egress rule
  # in networkpolicy.yaml is what makes it so. A Pocket ID that is only
  # resolvable on the LAN means the wiki cannot log anyone in.
  issuer: https://id.struble.app
  # The empty role every auto-registered user gets. Not a hardening nicety:
  # OIDC_REMOVE_FROM_GROUPS makes this role "always matched", so whatever it
  # points at is what every holder of a Pocket ID account receives. Pointing
  # it at anything but an empty role hands out read access by default.
  registrationRole: no-access
  # Pocket ID emits group NAMES under the `groups` scope; BookStack matches
  # them (lower-cased, spaces to hyphens) against each role's External
  # Authentication IDs, falling back to the role display name.
  groupsClaim: groups
  # Destinations the app may reach on 443 — in practice the OIDC issuer's
  # discovery endpoint, which BookStack fetches server-side.
  #
  # A CIDR list rather than a hostname is a limit of k3s' policy controller,
  # not a shortcut: the embedded kube-router netpol controller has no FQDN or
  # L7 rules, so `auth.struble.app` cannot be expressed at all. The default
  # is every address on 443, which is a real exfil path from a PHP pod and is
  # written down as such. Tighten it to the IdP's address (or the LAN
  # segment) once plans/canonical-cluster-urls gives the issuer a stable
  # private answer.
  egressCidrs:
    - 0.0.0.0/0

persistence:
  # One local PV, two mounts: the database's data dir AND BookStack's
  # /config (which holds storage/ and public/uploads/). A DB-only volume
  # would lose every uploaded image on a pod delete, silently, because the
  # volume is node-pinned and reschedules are rare enough to never notice.
  size: 10Gi
  storageClassName: wiki-data
  # Host directory behind the static PV, on mjolnir's NVMe. Created and
  # pre-owned by systemd.tmpfiles in nix/services/k3s.nix — the same trick
  # k8s/manifests/local-pvs.yaml uses for postgres.
  hostPath: /var/lib/wiki

seed:
  # The Job that turns an empty BookStack into the permission model this
  # file describes. Runs `php artisan` inside the app image, so it needs no
  # API token (see the comment in templates/seed-job.yaml for why that
  # matters). Idempotent: re-running asserts rather than duplicates.
  enabled: true
  admin:
    email: admin@struble.app
    name: Wiki Admin
    # The Pocket ID `sub` claim of the admin account. This is the one value
    # nothing else can guess, and it is why the admin is usable at all:
    # BookStack does NOT link an existing local user to an OIDC identity by
    # email, so an admin created with a password becomes a second, no-access
    # user the moment OIDC login is enabled. Empty refuses to run the Job.
    externalAuthId: ""
  # Roles are created with External Authentication IDs equal to their names,
  # so a Pocket ID group of the same name maps to them. Display names are
  # editable in the UI; a rename would silently strip everyone's role on
  # their next login, which is why the ID is set explicitly.
  #
  # Audience roles carry NO global permissions, deliberately. BookStack has a
  # set of global `*-view-all` permissions that are evaluated before entity
  # grants, so a single one of them on a role makes every entity grant on this
  # wiki decorative. BookStack's own Viewer/Public roles ship with five of
  # them; the seed strips them and says so. Verified: with them, a family user
  # opened the Cluster book; without, they got 404 and plex-users got the
  # mirror image.
  #
  # Trimmed deliberately: `wiki-ops` was dropped as probably the same two
  # people as `wiki-admin`, and `calibre-users` had no stated audience. A
  # group is cheap to add and expensive to remove once content depends on it.
  roles:
    - name: no-access
      # No system_name: an empty custom role. No external_auth_id either —
      # it must be assignable without matching any group.
      externalAuthId: ""
    - name: wiki-admin
      systemName: admin
      externalAuthId: wiki-admin
    - name: family
      externalAuthId: family
    - name: plex-users
      externalAuthId: plex-users
  # Shelf = audience, book = topic. Enforcement lives on books (shelf
  # permissions do not cascade — a shelf is a filing label). `viewers` is the
  # list of roles granted view at book level, cascading to chapters and pages
  # unless a child overrides it.
  shelves:
    - name: Family
      viewers: [family, wiki-admin]
      books: [Printers, Travel, Home]
    - name: Home Apps
      viewers: [family, plex-users, wiki-admin]
      books: [Plex]
    - name: Ops
      viewers: [wiki-admin]
      books: [Cluster, Network]
  # One chapter per book, restricted to wiki-admin. The whole permission
  # model rests on this convention: "if a friend should not see it, write it
  # in Internal" is a decision about WHERE you save, never a dialog.
  #
  # Making a chapter deny what its book allows needs more than the absence of
  # a grant: BookStack walks up the entity chain and stops at the first level
  # that carries a role_id = 0 "fallback" row, which is how an entity says "I
  # am not inheriting". The seed writes that row via BookStack's own
  # PermissionsUpdater, because a hand-rolled set of per-role rows looks
  # correct in every table and still lets the audience read the chapter.
  internalChapter: Internal
  internalViewers: [wiki-admin]
