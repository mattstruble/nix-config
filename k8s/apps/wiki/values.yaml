# Values for the wiki chart (BookStack + MariaDB).
#
# The namespace is not a value here: it comes from the render/apply
# invocation (`--namespace wiki` in nix/services/k3s.nix) as
# `.Release.Namespace`, the precedent the ai chart follows — a key nothing
# reads can only drift.
# Images follow the repo-wide `repository:tag@digest` convention
# (k8s/README.md); Renovate bumps the tag and the digest job rehashes it, so
# a BookStack security release is a one-line diff rather than an SSH session.
#
# BookStack is pinned to a LinuxServer image rather than upstream because
# upstream publishes no container image at all — its own docs point at
# LinuxServer or solidnerd. That choice has a price, and it is recorded in
# the pod's securityContext below rather than glossed over.

bookstack:
  # ghcr.io rather than lscr.io for the same bytes: ghcr speaks the registry
  # auth flow scripts/resolve-digest.sh (and Renovate) can authenticate to.
  image: ghcr.io/linuxserver/bookstack:v26.09.2-ls293@sha256:2fdeeb1a2028ce7cb1274696237e32b9f849e16b6d77314d08c78356a6016fca
  # What users type, what BookStack puts in every redirect and in the
  # absolute URLs it stores for images. Changing it later needs
  # `php artisan bookstack:update-url`, not just a value bump.
  #
  # This is the LAN name, not the canonical one, and it is load-bearing in a
  # way a hostname usually is not: BookStack derives its OIDC redirect_uri
  # from APP_URL, so the Pocket ID client must list https://<this>/oidc/callback
  # or every login dies with an invalid_redirect_uri error. It has to equal
  # `ingress.host` below, and the render refuses when the two differ
  # (templates/ingress.yaml); the serving certificate is read out of the
  # rendered Ingress at activation, so it cannot drift from either.
  #
  # Canonical-URLs phase 0 (cert-manager + CoreDNS views, wiki plan
  # plans/canonical-cluster-urls.md) replaces this with wiki.struble.app and a
  # real certificate. At that cutover three things move together: this value,
  # `ingress.host`, and the redirect URIs registered in Pocket ID.
  appUrl: https://wiki.mjolnir
  # The unprivileged user the app actually runs as after s6 init. 983 is
  # unassigned on mjolnir; the host directory is pre-owned by it (the
  # systemd.tmpfiles rules in nix/services/k3s.nix, on the directory
  # k8s/manifests/wiki-local-pv.yaml exports) because the cluster's
  # non-root stance forbids a root chown initContainer.
  uid: 983
  gid: 983
  port: 80
  # CIDRs or addresses whose X-Forwarded-* headers Laravel trusts, rendered
  # as APP_PROXIES (the name this version reads: app/Config/app.php `proxies`,
  # applied by app/Http/Middleware/TrustProxies.php). Empty means no proxy is
  # trusted, which is correct only while nothing proxies to this pod. Once
  # the Pangolin connector lands it connects from the pod network, so every
  # request would appear to come from the connector: login throttling would
  # lock the whole household on one person's failed logins and every audit
  # line would record the same source IP. The connector PR must set this to
  # the connector's pod/network — named as an acceptance item in RUNBOOK.md's
  # tunnel note; Pocket ID sets TRUST_PROXY for the same reason.
  #
  # It is no longer empty because the LAN Ingress already proxies this pod:
  # traefik runs as a pod inside the cluster CIDR and sends X-Forwarded-For,
  # so with no trusted proxy every request would arrive bearing traefik's own
  # address. Laravel would then apply one bucket to the whole household — one
  # person's failed logins would lock everyone out, and every audit line would
  # name traefik as the client. Scoped to the pod CIDR rather than traefik's
  # pod IP because that IP is reassigned on every restart; it is the same
  # `clusterCidr` the host firewall scopes its probe rule to. Widening it
  # further would let any pod in the cluster forge a client address.
  trustedProxies: "10.42.0.0/16"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

ingress:
  # The LAN path in. Traefik (kept in k3s for exactly this, see the
  # `disable` list in nix/services/k3s.nix) terminates TLS on mjolnir:80/443
  # and proxies to the pod over the CNI network, which is why
  # templates/networkpolicy.yaml carries a matching ingress-from-traefik rule
  # — without that rule the Ingress object is valid, the pod reports Ready,
  # and every request is dropped in silence.
  #
  # `wiki.mjolnir` must resolve to the node (10.0.0.4) in LAN DNS. It is NOT
  # automatic: the `.mjolnir` zone is per-host, not a wildcard — verified on
  # the node, where grafana.mjolnir resolves and wiki.mjolnir does not. Until
  # that record is added the Ingress is live and unreachable, which from
  # outside looks identical to the NetworkPolicy rule being missing: a browser
  # that never gets an answer. Check DNS first.
  enabled: true
  className: traefik
  # Must equal bookstack.appUrl's host; the render fails when it does not.
  host: wiki.mjolnir
  # Self-signed at activation, 10 years, regenerated every pass so it stays
  # inside the prune scope — the grafana-tls precedent, including its
  # accepted wart: the browser warns on first use and on every regeneration.
  tlsSecret: wiki-tls # pragma: allowlist secret (a Kubernetes Secret name, not a credential)

database:
  image: mariadb:11@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
  # The mariadb image's own user. Pre-owned host dir, same reasoning as above.
  uid: 999
  gid: 999
  port: 3306
  database: bookstack
  username: bookstack
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

# The Secret this chart REFERENCES and never creates. Keys are the container's
# own env var names, because that is what the pod reads; who creates it is
# nix/services/k3s.nix (see SECRETS.md for the contract).
# The allowlist pragma is for the word "secret" in a key whose value is a
# fixed name, not a credential — no secret value ever appears in this file.
secretName: bookstack # pragma: allowlist secret

oidc:
  # The source of truth for this value is Pocket ID's APP_URL in
  # nix/services/homelab/homelab.nix: Pocket ID signs the `iss` claim from
  # its own APP_URL, and BookStack validates `iss` against this exact string.
  # A mismatch does not error — the login simply never completes, which is
  # exactly the shape that tempts an operator into loosening issuer
  # validation. Do not; align this value instead. The oidc-issuer-linked job
  # in .github/workflows/k8s-manifest-diff.yml fails CI when the two drift.
  # (Which durable hostname the IdP answers on — auth vs id — is an open
  # decision with no record in this repo. Until it is made, these two values
  # are the only sources of truth, and they have to agree.)
  #
  # BookStack fetches <issuer>/.well-known/openid-configuration from inside
  # its own pod, so this must be reachable from the cluster — the egress rule
  # in networkpolicy.yaml is what makes it so. A Pocket ID that is only
  # resolvable on the LAN means the wiki cannot log anyone in.
  issuer: https://auth.struble.app
  # Pocket ID emits group NAMES under the `groups` scope; BookStack matches
  # them (lower-cased, spaces to hyphens) against each role's External
  # Authentication IDs, falling back to the role display name.
  groupsClaim: groups
  # Destinations the app may reach on 443 — in practice the OIDC issuer's
  # discovery endpoint, which BookStack fetches server-side.
  #
  # A CIDR list rather than a hostname is a limit of k3s' policy controller,
  # not a shortcut: the embedded kube-router netpol controller has no FQDN or
  # L7 rules, so `auth.struble.app` cannot be expressed at all. That limit is
  # what makes this list easy to get wrong, because the name and the address
  # it resolves to are not on the same network:
  #
  #   - 10.0.0.0/24 — Pocket ID runs on roque, and roque advertises this
  #     segment to the tailnet (nix/services/homelab/homelab.nix,
  #     --advertise-routes). This covers a pod that reaches the IdP by LAN.
  #   - the edge /32 — but the pod resolves `auth.struble.app` through public
  #     DNS, which answers with the Pangolin edge, not with roque. The fetch
  #     therefore leaves the cluster for the edge address and tunnels back.
  #     With only the /24 above, the discovery request is dropped and no login
  #     ever completes, while every pod reports Healthy.
  #
  # The edge address is a public IP this file cannot observe, so the
  # `wiki-issuer-egress-covered` job in .github/workflows/k8s-manifest-diff.yml
  # resolves oidc.issuer and fails when no entry here covers the answer. That
  # is the point of listing it: a VPS migration turns into a red check naming
  # the address, instead of a wiki that silently refuses to authenticate.
  # Canonical-URLs phase 0 (CoreDNS views) is the real fix — it makes the name
  # resolve on-LAN, at which point the /32 can go away.
  #
  # 0.0.0.0/0 is not the default and should not become one: it is a real exfil
  # path from a PHP pod, so widening it must be a decision a diff records.
  #
  # An empty list is a WILDCARD, not a refusal. `to` holds peers, and a
  # NetworkPolicy egress rule with no peer matches every destination, so
  # emptying this list — the intuitive way to turn the rule off while
  # debugging — would open TCP/443 from the bookstack pod to the whole
  # internet. The chart therefore fails the render on an empty or missing
  # list; to actually close the traffic, delete the rule from
  # templates/networkpolicy.yaml.
  egressCidrs:
    - 10.0.0.0/24
    # The Pangolin edge, as observed resolving auth.struble.app. Not recorded
    # anywhere else in this repo; the CI job above is what keeps it honest.
    - 66.63.168.18/32

persistence:
  # One local PV, two mounts: the database's data dir AND BookStack's
  # /config (which holds storage/ and public/uploads/). A DB-only volume
  # would lose every uploaded image on a pod delete, silently, because the
  # volume is node-pinned and reschedules are rare enough to never notice.
  size: 10Gi
  # The storage class and the host directory are deliberately NOT values:
  # the claim hardcodes storageClassName: wiki-data (templates/pvc.yaml) to
  # match the PV, and the host directory on mjolnir's NVMe is
  # spec.local.path in k8s/manifests/wiki-local-pv.yaml — the one file that
  # decides it, its contents created and pre-owned by the systemd.tmpfiles
  # rules in nix/services/k3s.nix. A values key for either would be a knob
  # wired to nothing.
