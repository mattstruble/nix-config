# The claim that binds the wiki's single local PV
# (k8s/manifests/wiki-local-pv.yaml). Both workloads mount it, with different
# subPaths: one volume, one backup story, one thing to move.
#
# persistence.size must not exceed the capacity in that PV manifest, and the
# two live in different files because different mechanisms apply them (k3s'
# manifest auto-loader for the cluster-scoped PV, this chart for the
# namespaced claim). A claim larger than the PV does not error at render
# time; it sits Pending forever.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wiki-data
  labels:
    app.kubernetes.io/part-of: wiki
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: wiki-data
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
