{{- /*
Containment for the wiki namespace. k3s enforces these: its embedded
kube-router network-policy controller is on by default (only
--disable-network-policy turns it off, and services.k3s.disable lists just
metrics-server), so these rules bite on stock Flannel with no Cilium or
Calico. That is also why the egress allows below are load-bearing rather than
decorative: k8s/manifests/ai-networkpolicies.yaml carries the correction to an
earlier "Flannel ignores NetworkPolicy" claim, which was wrong.

Order matters and is not accidental: a namespace with no policy selecting a
pod is DEFAULT ALLOW, so the deny has to be applied before the workloads or
the first apply leaves BookStack wide open until the second one. `helm
template` emits kinds in Helm's install order, which puts NetworkPolicy
immediately after Namespace, and the apply script feeds that file to kubectl
in document order — so the deny lands first.

Three policies, and the set is closed: anything not written here is dropped.
  1. deny everything, both directions, for every pod in the namespace
  2. bookstack: in from the LAN Ingress and the edge connector; out to DNS,
     the database, and 443 to the OIDC issuer
  3. mariadb:   in from bookstack only; no egress at all

Two ingress paths reach BookStack, and each is a separate rule because they
carry different trust:

  - traefik, for the LAN Ingress (templates/ingress.yaml). Traefik is a pod
    in kube-system, not hostNetwork, so the source is the pod and the
    namespace+pod selector below is what matches it. Naming traefik rather
    than the pod CIDR keeps every other pod in the cluster out; allowing the
    CIDR would let any pod in the cluster reach BookStack directly and skip
    whatever the edge eventually decides.
  - the Pangolin connector, for the published path. It names the `edge`
    namespace and a connector pod label that do not exist yet, so that rule
    matches nothing today — the correct reading until the connector lands,
    not a mistake to fix in advance.

Nothing about the wiki's exposure is decided by anything outside this file.
Setting ingress.enabled false removes the traefik rule in the same apply,
so the route and its permission cannot drift apart.

oidc.egressCidrs is guarded rather than ranged bare, and the reason is the
shape of the bug it prevents: `to` is a list of peers, and a rule whose peer
list is empty matches every destination. An empty value therefore does not
mean "no egress" — it means the opposite of what the operator reaching for it
intended, on the one port (443) that reaches the rest of the network. A bare
range cannot tell "narrowed" from "widened to everything", so the template
checks it and refuses to render.
*/ -}}
{{- $egressCidrs := .Values.oidc.egressCidrs -}}
{{- if not $egressCidrs -}}
  {{- fail "oidc.egressCidrs must list at least one CIDR. An empty list is not a refusal: it renders the TCP/443 egress rule with no `to` peer, and a NetworkPolicy rule with no peer matches EVERY destination — so emptying it opens 443 from the bookstack pod to the whole internet. List the IdP's segment (the default, 10.0.0.0/24), or delete the rule from templates/networkpolicy.yaml to actually close it." -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wiki-default-deny
  labels:
    app.kubernetes.io/part-of: wiki
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstack
  labels:
    app.kubernetes.io/part-of: wiki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bookstack
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The LAN path: traefik, and only traefik. This rule is the difference
    # between an Ingress that works and an Ingress that looks healthy while
    # every request is dropped, because the namespace default-deny above
    # otherwise swallows the proxied connection.
    {{- if .Values.ingress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: {{ .Values.bookstack.port }}
    {{- end }}
    # The published path, once the Pangolin connector exists. Kept now so the
    # connector's only job is to arrive with the right labels, not to edit a
    # policy that guards a login page.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
          podSelector:
            matchLabels:
              app.kubernetes.io/component: connector
      ports:
        - protocol: TCP
          port: {{ .Values.bookstack.port }}
  egress:
    # Service discovery for `mariadb`. Without this the pod cannot even
    # resolve its own database, which is the failure mode a default-deny-egress
    # policy written from the ticket text produces.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
    # OIDC discovery + any future webhook. See oidc.egressCidrs for why this
    # is a CIDR and why its default is the IdP's private segment rather than
    # the whole internet.
    - to:
        {{- range $egressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/part-of: wiki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
    # Ingress only, deliberately. Egress is already denied by the
    # namespace-wide policy, and adding an Egress type here with no rules
    # would not re-open it — but omitting it keeps the intent unambiguous:
    # the database listens, it does not call out.
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bookstack
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
