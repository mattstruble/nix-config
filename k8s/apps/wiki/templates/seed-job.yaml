{{- if .Values.seed.enabled }}
{{- /*
One shot that makes an empty BookStack into the model values.yaml describes.

TIGHTER THAN THE APPLICATION, on purpose. The Job runs the same image as the
app but overrides the entrypoint, so s6 never starts, so nothing needs root:
runAsUser 983 with every capability dropped and no privilege escalation. It
is the proof that the app's root-at-init is a property of s6-overlay and not
of BookStack — and running as 983 also stops the Job writing root-owned files
into a directory the app (uid 983) then cannot write to.

The name carries a hash of the seed ConfigMap. A Job's pod template is
immutable, so a Job named `wiki-seed` would make `kubectl apply` fail on the
first values change that altered the script; a fresh name per content makes
each change a new Job, and the prune pass deletes the one it replaced. The
hash is of the ConfigMap rather than of the Job so that an unrelated chart
change does not re-run the seed.
*/ -}}
{{- $seedHash := include (print $.Template.BasePath "/seed-configmap.yaml") . | sha256sum | trunc 10 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: wiki-seed-{{ $seedHash }}
  labels:
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: wiki
spec:
  # A seed that fails must stay visible and must not silently retry into
  # partial states forever; four attempts covers the realistic case (database
  # not up yet) without masking a real error.
  backoffLimit: 4
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/component: seed
        app.kubernetes.io/part-of: wiki
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: {{ .Values.bookstack.uid }}
        runAsGroup: {{ .Values.bookstack.gid }}
        fsGroup: {{ .Values.bookstack.gid }}
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: seed
          image: {{ required "bookstack.image is required" .Values.bookstack.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - /seed/seed.sh
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: APP_KEY
            - name: DB_HOST
              value: wiki-mariadb
            - name: DB_PORT
              value: "{{ .Values.database.port }}"
            - name: DB_DATABASE
              value: {{ .Values.database.database }}
            - name: DB_USERNAME
              value: {{ .Values.database.username }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: DB_PASSWORD
            - name: SEED_ADMIN_EMAIL
              value: {{ .Values.seed.admin.email | quote }}
            - name: SEED_ADMIN_NAME
              value: {{ .Values.seed.admin.name | quote }}
            # Empty by default, and seed.sh refuses to run on it: the admin
            # must be bound to the OIDC subject or the wiki has no usable
            # administrator once OIDC is the only auth method.
            - name: SEED_EXTERNAL_AUTH_ID
              value: {{ .Values.seed.admin.externalAuthId | quote }}
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
            # The app's storage/ and bootstrap/cache/ — artisan writes logs
            # and the compiled service manifest here.
            - name: data
              mountPath: /config
              subPath: bookstack
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: seed
          configMap:
            name: wiki-seed
            defaultMode: 0555
        - name: data
          persistentVolumeClaim:
            claimName: wiki-data
        - name: tmp
          emptyDir: {}
{{- end }}
