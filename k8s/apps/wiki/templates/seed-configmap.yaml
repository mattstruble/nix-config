{{- if .Values.seed.enabled }}
{{- /*
The permission model, as data.

Two files ship together: seed.sh drives the sequence and seed.php asserts the
model. They live in a ConfigMap so the logic is reviewable in a diff and the
Job spec stays boring.

Why `php artisan` and not the REST API: the API authenticates with per-user
tokens minted in a user's profile page, and those tokens never expire. A
standing admin API token is a credential that bypasses OIDC entirely — the
most powerful thing in the system — existing only to serve a Job that can
already run PHP in-process against the database. There is also a chicken-and-
egg problem: with AUTH_METHOD=oidc there is no password form, so no UI
session, so no first admin, so no token to create one.

The config is rendered from values as JSON, so the model this Job enforces is
the model values.yaml describes — one source, not two that drift.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiki-seed
  labels:
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: wiki
data:
  seed.json: {{ mustToJson (dict
      "admin" .Values.seed.admin
      "roles" .Values.seed.roles
      "shelves" .Values.seed.shelves
      "internalChapter" .Values.seed.internalChapter
      "internalViewers" .Values.seed.internalViewers
      "registrationRole" .Values.oidc.registrationRole
      "database" .Values.database.database) | quote }}
  wait-for-schema.php: |
    <?php
    /**
     * Is the application's schema in place yet? Exit 0 yes, 1 no.
     *
     * Plain PDO rather than `php artisan tinker --execute=...`: tinker is
     * listed in this image's artisan command list but throws as soon as you
     * use it, which turned the wait loop below into a 300-second stall on
     * every run. Discovered by running the Job, not by reading the command
     * list. This also means the check works before the application has
     * finished bootstrapping, which is precisely when it runs.
     */
    $dsn = sprintf(
        'mysql:host=%s;port=%s;dbname=%s',
        getenv('DB_HOST'),
        getenv('DB_PORT'),
        getenv('DB_DATABASE')
    );
    try {
        $pdo = new PDO($dsn, getenv('DB_USERNAME'), getenv('DB_PASSWORD'), [
            PDO::ATTR_TIMEOUT => 3,
            PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
        ]);
        $st = $pdo->prepare(
            'select count(*) from information_schema.tables
             where table_schema = ? and table_name = ?'
        );
        $st->execute([getenv('DB_DATABASE'), 'users']);
        exit(((int) $st->fetchColumn()) > 0 ? 0 : 1);
    } catch (Throwable $e) {
        fwrite(STDERR, $e->getMessage() . "\n");
        exit(1);
    }
  seed.sh: |
    #!/bin/bash
    # Fail loudly and early: a half-seeded wiki looks identical to a fully
    # seeded one from the outside, and differs entirely when someone reads it.
    set -euo pipefail

    APP=/app/www
    cd "$APP"

    if [ -z "${SEED_EXTERNAL_AUTH_ID:-}" ]; then
      echo "refusing to seed: seed.admin.externalAuthId is empty." >&2
      echo "It must be the Pocket ID 'sub' claim of the admin account. BookStack" >&2
      echo "does not link an existing local user to an OIDC identity by email, so" >&2
      echo "an admin created any other way becomes a second, no-access user the" >&2
      echo "moment OIDC login is enabled." >&2
      exit 1
    fi

    # Wait for the application pod to have run its migrations. The image
    # migrates at container start, and two processes running the same
    # migrations concurrently over MySQL (where DDL does not roll back) is a
    # corruption-shaped race, so the Job defers rather than races. If nothing
    # has created the schema after the wait, the app is not coming and the Job
    # migrates for itself — that is the "run against an empty database" case.
    SCHEMA_READY=0
    for i in $(seq 1 60); do
      if /usr/bin/php /seed/wait-for-schema.php >/dev/null 2>&1; then
        SCHEMA_READY=1
        echo "schema present (application has migrated)"
        break
      fi
      sleep 5
    done
    if [ "$SCHEMA_READY" = "0" ]; then
      echo "no schema after 300s; the application has not migrated, migrating here" >&2
    fi

    # Idempotent: with the schema current this is a no-op, and it is what
    # makes the Job work against a restored-from-nothing database.
    /usr/bin/php artisan migrate --force

    # --initial rewrites the migration-created admin@admin.com account (which
    # every fresh BookStack database ships with, password "password") into the
    # real admin, bound to the OIDC subject so no local password exists at
    # all. Exit 2 means an admin already exists and was left alone — the
    # expected state on every run after the first.
    set +e
    /usr/bin/php artisan bookstack:create-admin --initial \
      --email="${SEED_ADMIN_EMAIL}" --name="${SEED_ADMIN_NAME}" \
      --external-auth-id="${SEED_EXTERNAL_AUTH_ID}"
    rc=$?
    set -e
    if [ $rc -eq 2 ]; then
      echo "admin already present; create-admin skipped"
    elif [ $rc -ne 0 ]; then
      echo "create-admin failed with exit $rc" >&2
      exit $rc
    fi

    /usr/bin/php /seed/seed.php

    # Entity and role permissions are pre-computed into joint_permissions for
    # every request; writing grants directly leaves that table stale, which
    # shows up as content being visible to the wrong people until something
    # else touches it. This is the documented repair step, not a shortcut.
    /usr/bin/php artisan bookstack:regenerate-permissions
    echo "wiki permission model asserted"
  seed.php: |
    <?php
    /**
     * Assert the wiki's permission model. Idempotent: every step reads the
     * current state, changes only what differs, and prints what it changed.
     * Exits non-zero if it cannot reach the described state, so a Job that
     * reports success is a wiki that actually matches this file.
     */
    require '/app/www/vendor/autoload.php';
    $app = require '/app/www/bootstrap/app.php';
    $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

    use BookStack\Entities\Models\Book;
    use BookStack\Entities\Models\Chapter;
    use BookStack\Entities\Models\Bookshelf;
    use BookStack\Entities\Tools\PermissionsUpdater;
    use BookStack\Entities\Tools\SlugGenerator;
    use BookStack\Permissions\Models\RolePermission;
    use BookStack\Settings\SettingService;
    use BookStack\Users\Models\Role;

    /**
     * Everything runs inside this catch, and the reason is unglamorous and
     * important: with a hand-bootstrapped kernel an uncaught exception is
     * PRINTED and the process still exits 0. Verified against the running
     * image — a thrown error here reported exit_code=0, which meant the Job
     * declared the permission model asserted while it had asserted nothing.
     * The Job's exit code is the only signal anyone gets, so it is caught
     * here rather than trusted to the framework.
     */
    try {
        seed();
    } catch (\Throwable $e) {
        fwrite(STDERR, 'seed failed: ' . $e->getMessage() . "\n");
        fwrite(STDERR, $e->getFile() . ':' . $e->getLine() . "\n");
        exit(1);
    }
    exit(0);

    function seed(): void
    {

    $cfg = json_decode(file_get_contents('/seed/seed.json'), true, 512, JSON_THROW_ON_ERROR);
    $changed = [];

    // BookStack generates entity slugs in its service layer, not in a model
    // event — creating an entity by saving the model directly leaves slug
    // empty, and every URL for it 404s. Found by trying to open a book the Job
    // had just created. Uses BookStack's own generator, so slugs match what
    // the UI would produce and collisions are handled the same way.
    $ensureSlug = function ($entity) {
        if (!empty($entity->slug)) {
            return $entity;
        }
        $entity->slug = app(SlugGenerator::class)->regenerateForEntity($entity);
        $entity->save();
        return $entity;
    };

    // ── Roles ──────────────────────────────────────────────────────────────
    // A role with a systemName is FOUND by that name, not created: BookStack
    // ships an Admin role carrying system_name=admin, and a second role with
    // the same system_name would make getSystemRole('admin') a coin toss.
    // So the wiki-admin entry binds the Pocket ID group to the role that
    // already has admin powers, rather than minting a rival.
    //
    // Otherwise a role is identified by display_name. Group sync matches the
    // Pocket ID group name against external_auth_id when set and display_name
    // otherwise, lower-cased with spaces turned into hyphens — so display
    // names are set once here and then never relied on. They are editable in
    // the UI, and a rename with no external_auth_id behind it silently strips
    // every member's role at their next login.
    $rolesByName = [];
    foreach ($cfg['roles'] as $spec) {
        $systemName = $spec['systemName'] ?? null;
        $role = $systemName
            ? Role::query()->where('system_name', $systemName)->first()
            : Role::query()->where('display_name', $spec['name'])->first();
        if (!$role) {
            if ($systemName) {
                // Not fatal: a fresh install always has it, so its absence
                // means upstream renamed it, and refusing to continue is
                // better than quietly creating an admin nobody asked for.
                fwrite(STDERR, "no role with system_name='$systemName' to bind group '{$spec['name']}' to\n");
                exit(1);
            }
            $role = new Role();
            $role->display_name = $spec['name'];
            $role->save();
            $changed[] = "role created: {$spec['name']}";
        }
        $wantAuthId = $spec['externalAuthId'] ?? '';
        // Assigned property by property, not via fill(): system_name is not
        // in Role::$fillable, so a fill() carrying it is dropped in silence.
        // That is how the first version of this script reported "role updated:
        // wiki-admin (system_name)" on every single run and never changed a
        // thing — an idempotency check that never converges is the tell.
        if ((string) $role->external_auth_id !== $wantAuthId) {
            $role->external_auth_id = $wantAuthId;
            $changed[] = "role group id set: {$role->display_name} -> {$wantAuthId}";
        }
        if ($role->display_name !== $spec['name']) {
            $role->display_name = $spec['name'];
            $changed[] = "role renamed to: {$spec['name']}";
        }
        $role->save();
        $rolesByName[$spec['name']] = $role;
    }

    // Global permissions: the audience roles get NONE, and that is the whole
    // point rather than an oversight.
    //
    // BookStack has two independent ways to grant a read, and the global one
    // wins. `book-view-all` means "every book, always", and it is evaluated
    // before entity permissions — so a role carrying it sees books that were
    // explicitly never granted to it. The first version of this script handed
    // the audience roles BookStack's own Viewer baseline (ten permissions,
    // three of them *-view-all) and a family user could open the Cluster book
    // by URL. Verified: with those ten, every book returned 200 to every
    // audience; with none, family got Printers/Plex 200 and Cluster 404 while
    // a plex-users member got the mirror image.
    //
    // So all reads come from entity grants. The one exception is the admin
    // role, which is skipped below and carries its permissions by system_name.
    foreach ($cfg['roles'] as $spec) {
        $role = $rolesByName[$spec['name']];
        // The role with admin powers carries its permissions by system_name;
        // syncing them here would fight whatever BookStack considers an admin
        // to hold.
        if (($spec['systemName'] ?? null) === 'admin') {
            continue;
        }
        $want = [];
        $have = $role->permissions->pluck('name')->all();
        if (array_values($have) !== array_values($want)) {
            $role->permissions()->sync([]);
            $changed[] = "role permissions cleared: {$spec['name']} (had " . count($have) . ')';
        }
    }

    // ── No role may hold a blanket read ────────────────────────────────────
    // BookStack ships Editor, Viewer and Public with `book-view-all`,
    // `page-view-all` and friends: a single global permission that reads
    // "everything, everywhere", evaluated before any entity grant. Nobody is
    // placed in those roles by this wiki — auto-registration goes to the empty
    // no-access role — so they sit unused. But an admin who later meets a new
    // user in the UI and picks the obvious-looking "Viewer" has just granted
    // that person the entire wiki, and nothing in the interface suggests it.
    //
    // So the invariant is asserted rather than left to care: no non-admin role
    // in this database holds a *-view-all permission. Reversible in the UI,
    // which is exactly why it is stated here instead of assumed.
    $blanket = RolePermission::query()->where('name', 'like', '%-view-all')->pluck('id', 'name');
    foreach (Role::query()->whereNull('system_name')->orWhere('system_name', '!=', 'admin')->get() as $role) {
        $held = $role->permissions->pluck('name')->intersect($blanket->keys());
        if ($held->isNotEmpty()) {
            $role->permissions()->sync(
                $role->permissions()->whereNotIn('role_permissions.id', $blanket->values()->all())->pluck('role_permissions.id')->all()
            );
            $changed[] = "blanket read permissions removed from {$role->display_name}: " . $held->implode(', ');
        }
    }

    // ── The auto-registration default ──────────────────────────────────────
    // Load-bearing. While OIDC_REMOVE_FROM_GROUPS is on, BookStack treats this
    // role as always-matched and assigns it to everyone who authenticates. If
    // it points at anything with read access, then anyone who can reach the
    // login page and authenticate to Pocket ID can read the wiki.
    $defaultRole = $rolesByName[$cfg['registrationRole']] ?? null;
    if (!$defaultRole) {
        fwrite(STDERR, "registration role '{$cfg['registrationRole']}' is not in the configured role list\n");
        exit(1);
    }
    if ((int) app(SettingService::class)->get('registration-role', 0) !== $defaultRole->id) {
        app(SettingService::class)->put('registration-role', $defaultRole->id);
        $changed[] = "registration default role set to {$cfg['registrationRole']}";
    }

    // ── Shelves, books, and the one chapter convention ─────────────────────
    // Shelf = audience, book = topic. Enforcement lives on books: shelf
    // permissions do not cascade, because a book can sit on many shelves, so
    // a shelf is a filing label and nothing more.
    // Write permissions through BookStack's own writer rather than hand-
    // rolling entity_permissions rows.
    //
    // The hand-rolled version looked right in the database — one row per role,
    // view=1 for the audience and view=0 for everyone else, joint_permissions
    // reporting EXPLICIT_DENY — and a family user could still open the
    // Internal chapter and see it listed in the book. What was missing is the
    // row with role_id = 0: BookStack's fallback entry, whose presence is how
    // an entity says "I am not inheriting from my parent". Without it the
    // parent's allow wins, and the chapter-level deny is decoration. That row
    // is invisible unless you read the writer, and the writer is the API the
    // UI uses, so this calls it.
    //
    // It also calls rebuildPermissions() on the entity, so the pre-computed
    // joint_permissions table is never left describing the old model.
    $updater = app(PermissionsUpdater::class);
    $allRoleIds = Role::query()->pluck('id')->all();
    $grant = function ($entity, array $roleIds) use (&$changed, $updater, $allRoleIds) {
        $rolePermissions = [];
        foreach ($allRoleIds as $roleId) {
            $rolePermissions[] = [
                'role_id' => $roleId,
                'view' => in_array($roleId, $roleIds, true),
                'create' => false,
                'update' => false,
                'delete' => false,
            ];
        }
        $grantedCount = count($roleIds);
        // Idempotency check against the same shape this writes, fallback row
        // included — without it every run reports every entity as changed and
        // the "run it twice" test stops meaning anything.
        $desired = [];
        foreach ($allRoleIds as $roleId) {
            $desired[$roleId] = in_array($roleId, $roleIds, true);
        }
        $desired[0] = false; // the not-inheriting fallback row
        $current = [];
        foreach ($entity->permissions()->get() as $p) {
            $current[(int) $p->role_id] = (bool) $p->view;
        }
        ksort($current);
        ksort($desired);
        if ($current === $desired) {
            return;
        }
        $updater->updateFromApiRequestData($entity, [
            'role_permissions' => $rolePermissions,
            // inheriting=false + view=false is the whole convention: everyone
            // not named above is denied, whatever the parent allows.
            'fallback_permissions' => [
                'inheriting' => false,
                'view' => false,
                'create' => false,
                'update' => false,
                'delete' => false,
            ],
        ]);
        $changed[] = sprintf('%s "%s" visible to %d role(s), inheriting off',
            class_basename($entity), $entity->name, $grantedCount);
    };

    $roleIdsFor = function (array $names) use ($rolesByName) {
        $ids = [];
        foreach ($names as $n) {
            if (!isset($rolesByName[$n])) {
                fwrite(STDERR, "shelf/book references role '$n' which is not in the configured role list\n");
                exit(1);
            }
            $ids[] = $rolesByName[$n]->id;
        }
        return $ids;
    };

    foreach ($cfg['shelves'] as $shelfSpec) {
        $shelf = Bookshelf::query()->where('name', $shelfSpec['name'])->first();
        if (!$shelf) {
            $shelf = new Bookshelf();
            $shelf->name = $shelfSpec['name'];
            $shelf->description = '';
            $shelf->save();
            $ensureSlug($shelf);
            $changed[] = "shelf created: {$shelfSpec['name']}";
        }
        $bookIds = [];
        $shelfRoleIds = $roleIdsFor($shelfSpec['viewers']);
        foreach ($shelfSpec['books'] as $bookName) {
            $book = Book::query()->where('name', $bookName)->first();
            if (!$book) {
                $book = new Book();
                $book->name = $bookName;
                $book->description = '';
                $book->save();
                $ensureSlug($book);
                $changed[] = "book created: $bookName";
            }
            $bookIds[] = $book->id;
            $grant($book, $roleIdsFor($shelfSpec['viewers']));

            // One Internal chapter per book. This is the convention the whole
            // design rests on: "if a friend should not see it, write it in
            // Internal" is a decision about where you save, never a permission
            // dialog. A chapter-level deny overrides the book-level allow the
            // rest of the book inherits, which is exactly the upstream
            // behaviour this is built on.
            $chapter = Chapter::query()->where('book_id', $book->id)
                ->where('name', $cfg['internalChapter'])->first();
            if (!$chapter) {
                $chapter = new Chapter();
                $chapter->book_id = $book->id;
                $chapter->name = $cfg['internalChapter'];
                $chapter->description = 'Not for the audience this book is written for.';
                $chapter->save();
                $ensureSlug($chapter);
                $changed[] = "chapter created: $bookName/{$cfg['internalChapter']}";
            }
            $grant($chapter, $roleIdsFor($cfg['internalViewers']));
        }
        // Attach only: removing a book from a shelf is a human decision about
        // where content lives, not something a re-run should undo.
        $shelf->books()->sync($bookIds);
        // Shelves need their own grant. They do not inherit from books and
        // their permissions do not cascade to books — with no shelf grant the
        // audience's shelf listing is simply empty, so content exists and is
        // reachable by URL but nobody can browse to it. Verified: before this
        // existed, /shelves rendered empty for every audience.
        $grant($shelf, $shelfRoleIds);
    }

    if (!$changed) {
        echo "permission model already matches; nothing changed\n";
        return;
    }
    echo "changed:\n  - " . implode("\n  - ", $changed) . "\n";
    }

{{- /*
     Deliberately does NOT print a "what each role can see" summary: that
     would be a claim about the model rather than a check of it. The Job's
     proof is that it runs twice and the second run reports no change, plus
     the per-audience assertions in the runbook.
*/ -}}
{{- end }}
