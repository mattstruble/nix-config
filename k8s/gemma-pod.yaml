# Prototype (gfr.2): gemma-4-26b-a4b in a k8s pod on GPU1, replicating the
# docker container (services/llama-fleet.nix + _llama-models.nix gemma def).
#   - image: the official llama.cpp image (digest-pinned), entrypoint /app/llama-server
#   - GPU: runtimeClassName nvidia + NVIDIA_VISIBLE_DEVICES=1 (CDI-mode runtime)
#   - weights: /var/lib/llama-models via the llama-models PV (mounted /models, ROX)
#   - MTP drafter: -md (draft acceptance 1.0; the "Gemma4Assistant requires
#     ctx_other" line is a non-fatal warning, present in the docker container too)
# Superseded by the helm chart (gfr.8).
apiVersion: v1
kind: Pod
metadata:
  name: gemma-k8s
  namespace: default
  labels:
    app: gemma-4-26b-a4b
spec:
  runtimeClassName: nvidia
  containers:
    - name: llama-server
      image: ghcr.io/ggml-org/llama.cpp@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
      args:
        - "-m"
        - "/models/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf"
        - "--alias"
        - "gemma-4-26b-a4b"
        - "-md"
        - "/models/mtp-gemma-4-26B-A4B-it-Q8_0.gguf"
        - "--spec-type"
        - "draft-mtp"
        - "--spec-draft-n-max"
        - "2"
        - "--spec-draft-p-min"
        - "0.75"
        - "-ngl"
        - "99"
        - "-c"
        - "131072"
        - "-np"
        - "1"
        - "-ub"
        - "2048"
        - "--cache-type-k"
        - "q8_0"
        - "--cache-type-v"
        - "q8_0"
        - "--flash-attn"
        - "on"
        - "--jinja"
        - "--reasoning"
        - "off"
        - "--temp"
        - "0.6"
        - "--top-k"
        - "20"
        - "--top-p"
        - "0.8"
        - "--min-p"
        - "0"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8555"
        - "--api-key"
        - "foo"
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "1"
      ports:
        - containerPort: 8555
      volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: shm
          mountPath: /dev/shm
      resources:
        requests:
          memory: 4Gi
        limits:
          memory: 32Gi
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: llama-models-pvc
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
