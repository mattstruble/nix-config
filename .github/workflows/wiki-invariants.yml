name: wiki-invariants

# Two pairs of wiki values have to say the same thing and live in different
# languages: the uid/gid the chart runs the containers as (k8s/apps/wiki/values.yaml)
# against the owner of the host directory those containers mount (the
# systemd.tmpfiles rules in nix/services/k3s.nix), and the size the claim asks for
# against the capacity of the statically provisioned PV that is pre-bound to it
# (k8s/manifests/wiki-local-pv.yaml). Nothing in the render, in Helm's validation
# or at admission connects the two sides, and both failures are quiet in review:
# the uid pair crash-loops MariaDB against a datadir already owned by the old id,
# which a revert does not undo because the image only chowns an empty datadir; the
# size pair leaves the claim Pending forever with an event that names no file.
#
# GitHub skips a workflow entirely when no changed file matches its `paths:`, so a
# cross-file check is only as good as a filter that covers every file it reads:
# the change that breaks one of these pairs touches one of them by construction,
# and a check that is never scheduled for that PR is a check that passes. Hence
# the workflow file and the script are listed next to the three inputs.
#
# DELIBERATELY OUT OF SCOPE, and the window is accepted: the Secret name pair.
# `secretName` in the wiki values has to equal the name hardcoded three times in
# nix/services/k3s.nix, and a secretName-only change keeps CI green — the
# wiki-secret-keys-created job in k8s-manifest-diff.yml compares secretKeyRef key
# names only — while putting both pods into CreateContainerConfigError on the next
# deploy. It is not asserted here because all three occurrences sit inside the
# ai-chart-apply oneshot that another change deletes; an assertion pointed at them
# would be deleted along with them, and one pointed at nothing would pass. Re-add
# it once that deletion lands, aimed at whatever replaces the oneshot, or drop it
# for good if the replacement reads secretName from values.yaml. Both pairs this
# job does check survive that change: the tmpfiles rules are NixOS system config,
# and wiki-local-pv.yaml is a static manifest applied by k3s' own manifest
# loader, so it stays in the repo under Flux either way.
#
# A green run means five strings matched five other strings. It does not mean the
# values are correct, and it does not mean a pair cannot be changed on both sides
# at once — that is a legitimate edit and passes, by design.
on:
  pull_request:
    paths:
      - "k8s/apps/wiki/values.yaml"
      - "k8s/manifests/wiki-local-pv.yaml"
      - "nix/services/k3s.nix"
      - ".github/workflows/wiki-invariants.yml"
      - "scripts/check-wiki-invariants.sh"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki-values-agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runnable from a plain checkout, no nix, no helm, no cluster.
      - name: Wiki values that exist in two files must agree
        run: ./scripts/check-wiki-invariants.sh
