name: k8s-manifest-diff

on:
  pull_request:
    paths:
      - "k8s/**"
      - "nix/**"
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "nix/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  strata-bundle-linked:
    # The strata pod's bundle path is produced by the build (nix/services/k3s.nix
    # injects config.system.build.strata into the chart render), which is what
    # puts the bundle in the system generation's closure. A literal path
    # re-appearing in a values file is inert in production but makes every
    # standalone render disagree with it - and it is the shape that used to drift
    # silently with no CI signal. Assert the link exists and the pin does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30

      - name: Bundle must be linked by the build, not pinned in values
        run: |
          set -euo pipefail
          built=$(nix eval --raw .#nixosConfigurations.mjolnir.config.services.k3s.aiChart.strataBundle)
          echo "linked bundle: $built"
          case "$built" in
            /nix/store/*-strata-*) ;;
            *) echo "::error::services.k3s.aiChart.strataBundle is empty or not a strata bundle - the pod would mount nothing"; exit 1;;
          esac
          if grep -rn '^[[:space:]]*binary:[[:space:]]*/nix/store/.*-strata-' k8s/apps/ai/values/; then
            echo "::error::a strata values file pins a bundle path; the render injects it (see the ai.strataBundle helper)"
            exit 1
          fi

  manifest-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      # the bundles below are nix build outputs; the eval needs a nix
      - uses: cachix/install-nix-action@v30

      - name: Render PR and base, build comment
        run: |
          # Eval a bundle path the way `just k8s-render` does. Only stdout may reach
          # the value: nix writes noise to stderr ("Using saved setting for...",
          # "warning: Git tree is dirty" once the base restore dirties the tree), and
          # a multi-line value lands inside a YAML block scalar and breaks the render.
          # A failed or unrecognisable result degrades to a labelled placeholder - a
          # broken eval should not block manifest review, and strata-bundle-linked is
          # the job that asserts the real link.
          get_bundle() {
            local opt=$1 placeholder=$2 out
            out=$(nix eval --raw "$opt" 2>/dev/null) || out=""
            if [[ "$out" == /nix/store/* && "$out" != *$'\n'* ]]; then
              printf '%s' "$out"
            else
              echo "::warning::nix eval $opt gave no store path; the preview uses a placeholder" >&2
              printf '%s' "$placeholder"
            fi
          }
          STRATA_BUNDLE=$(get_bundle .#nixosConfigurations.mjolnir.config.services.k3s.aiChart.strataBundle /nix/store/00000000000000000000000000000000-strata-preview)
          HEADEND_BUNDLE=$(get_bundle .#nixosConfigurations.mjolnir.config.services.k3s.aiChart.headEndBundle /nix/store/00000000000000000000000000000000-head-end-preview)
          render() {
            # Render every chart under $1 (default: this checkout). Same values-file
            # glob as `just k8s-render` and the nix render derivations
            # (modules/services/k3s.nix); the chart dir is detected so a pre-rename
            # base renders too.
            local root=${1:-$PWD}
            local CHART="$root/k8s/apps/ai"; [ -d "$CHART" ] || CHART="$root/k8s/llama-fleet"
            local F=(-f "$CHART/values.yaml")
            local f
            for f in "$CHART"/values/*.yaml; do F+=(-f "$f"); done
            # the nix render injects the bundles it built; without them the preview
            # shows empty mount paths and disagrees with production
            F+=(--set "strataBundle=$STRATA_BUNDLE" --set "headEnd.bundle=$HEADEND_BUNDLE")
            helm template "$(basename "$CHART")" "$CHART" "${F[@]}"
            # No bundle injection here, and the absence guard is the point: a PR
            # that adds an app must diff against a base that does not have it,
            # which is the only way this preview shows the whole app as new
            # rather than showing nothing at all.
            local W="$root/k8s/apps/wiki"
            if [ -d "$W" ]; then
              helm template wiki "$W" -f "$W/values.yaml" --namespace wiki
            fi
          }
          render > /tmp/pr.yaml
          # Render the base from its own worktree. `git restore --source=base -- k8s/`
          # is not a base checkout: it rewrites the files the base has and leaves the
          # PR's new files where they are, so the "base" render mixes base values with
          # this PR's new templates and disagrees with what the base actually shipped.
          BASE="${{ github.event.pull_request.base.sha }}"
          if git cat-file -e "$BASE:k8s" 2>/dev/null; then
            git worktree add --detach --quiet /tmp/base-wt "$BASE"
            render /tmp/base-wt > /tmp/base.yaml
          else
            : > /tmp/base.yaml  # base has no k8s/ - everything is new
          fi
          {
            echo "## Rendered manifest diff"
            echo
            if diff -u /tmp/base.yaml /tmp/pr.yaml > /tmp/diff.txt; then
              echo "No changes to the rendered manifests."
            else
              echo '```diff'
              cat /tmp/diff.txt
              echo '```'
            fi
          } > /tmp/comment.md

      - name: Find existing comment
        id: fc
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          # Without an author filter this matches whatever comment a human
          # wrote last, and the next step then writes a rendered manifest diff
          # into their remark.
          comment-author: 'github-actions[bot]'
          body-includes: '## Rendered manifest diff'
          direction: last

      - name: Post or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/comment.md
          # The action's default is `append`, which stacks a second full diff
          # section under the first on every push: the stale one stays on top,
          # and the body grows toward GitHub's 65536-character comment limit
          # until the update itself starts failing.
          edit-mode: replace
          reactions: "+1"
