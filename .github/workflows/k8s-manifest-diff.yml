name: k8s-manifest-diff

on:
  pull_request:
    paths:
      - "k8s/**"
      - "nix/**"
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "nix/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  strata-bundle-linked:
    # The strata pod's bundle path is produced by the build (nix/services/k3s.nix
    # injects config.system.build.strata into the chart render), which is what
    # puts the bundle in the system generation's closure. A literal path
    # re-appearing in a values file is inert in production but makes every
    # standalone render disagree with it - and it is the shape that used to drift
    # silently with no CI signal. Assert the link exists and the pin does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30

      - name: Bundle must be linked by the build, not pinned in values
        run: |
          set -euo pipefail
          built=$(nix eval --raw .#nixosConfigurations.mjolnir.config.services.k3s.aiChart.strataBundle)
          echo "linked bundle: $built"
          case "$built" in
            /nix/store/*-strata-*) ;;
            *) echo "::error::services.k3s.aiChart.strataBundle is empty or not a strata bundle - the pod would mount nothing"; exit 1;;
          esac
          if grep -rn '^[[:space:]]*binary:[[:space:]]*/nix/store/.*-strata-' k8s/apps/ai/values/; then
            echo "::error::a strata values file pins a bundle path; the render injects it (see the ai.strataBundle helper)"
            exit 1
          fi

  manifest-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      # the bundles below are nix build outputs; the eval needs a nix
      - uses: cachix/install-nix-action@v30

      - name: Render PR and base, build comment
        run: |
          set -euo pipefail
          # The values a build supplies, per chart, eval'd from nix — the same text
          # the nix render reads and `just k8s-render` reads, so the preview cannot
          # render something production does not. A chart the eval cannot produce
          # renders without them and its own `required` guards decide whether that
          # is a failure; the preview never papers over a missing input with a
          # placeholder store path, which is a value no pod ever mounts.
          CHART_VALUES=$(mktemp -d)
          chart_values() {
            local chart=$1
            if nix eval --raw ".#nixosConfigurations.mjolnir.config.services.k3s.appChartValues.$chart" > "$CHART_VALUES/$chart" 2>/dev/null; then
              return 0
            fi
            rm -f "$CHART_VALUES/$chart"
            echo "::warning::nix eval gave no values for the $chart chart; its render must fail rather than preview something else" >&2
          }
          render() {
            # Render every chart under $1 (default: this checkout). A directory is a
            # chart when it carries a Chart.yaml — the rule nix/services/k3s.nix and
            # `just k8s-render` apply. Rendering the base from its own tree is what
            # makes a newly added app show as entirely new instead of invisible.
            local root=${1:-$PWD}
            local chart dir f rc=0
            for dir in "$root"/k8s/apps/*/; do
              [ -f "$dir/Chart.yaml" ] || continue
              chart=$(basename "$dir")
              local F=(-f "$dir/values.yaml")
              for f in "$dir"values/*.yaml; do F+=(-f "$f"); done
              [ -f "$CHART_VALUES/$chart" ] && F+=(-f "$CHART_VALUES/$chart")
              helm template "$chart" "$dir" "${F[@]}" || rc=1
            done
            return $rc
          }
          for dir in k8s/apps/*/; do [ -f "$dir/Chart.yaml" ] && chart_values "$(basename "$dir")"; done
          render > /tmp/pr.yaml
          # The render lands in a public pull-request comment. The contract in
          # k8s/apps/wiki/SECRETS.md is that the chart references a Secret and
          # never creates one; assert the rendered output holds no Secret
          # document before anything is posted.
          # The assertion runs on /tmp/pr.yaml - the same document the diff
          # below posts, not on a separate wiki-only render: the thing verified
          # must be the thing reported. The wiki-only render used to exist so
          # the check could look at just the wiki output; it is gone because
          # the ai chart renders no Secret documents, and if it ever did,
          # posting one in the public comment is exactly what this check
          # exists to prevent.
          # The check must not pass vacuously: require the wiki chart's
          # documents to be present in the render before the Secret-free grep
          # can mean anything. A renamed or removed wiki chart would otherwise
          # leave the grep with nothing to find and report "clean" for a PR
          # that removed the app.
          if ! grep -q '^# Source: wiki/' /tmp/pr.yaml; then
            echo "::error::the render contains no wiki chart documents; the Secret-free assertion would pass vacuously (chart renamed? render failed?)"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*kind:[[:space:]]*Secret[[:space:]]*$' /tmp/pr.yaml; then
            echo "::error::the rendered manifest contains a kind: Secret document; the chart must only reference the Secret the activation script creates (see k8s/apps/wiki/SECRETS.md)"
            exit 1
          fi
          # Render the base from its own worktree. `git restore --source=base -- k8s/`
          # is not a base checkout: it rewrites the files the base has and leaves the
          # PR's new files where they are, so the "base" render mixes base values with
          # this PR's new templates and disagrees with what the base actually shipped.
          BASE="${{ github.event.pull_request.base.sha }}"
          if git cat-file -e "$BASE:k8s" 2>/dev/null; then
            git worktree add --detach --quiet /tmp/base-wt "$BASE"
            render /tmp/base-wt > /tmp/base.yaml
          else
            : > /tmp/base.yaml  # base has no k8s/ - everything is new
          fi
          {
            echo "## Rendered manifest diff"
            echo
            if diff -u /tmp/base.yaml /tmp/pr.yaml > /tmp/diff.txt; then
              echo "No changes to the rendered manifests."
            else
              echo '```diff'
              cat /tmp/diff.txt
              echo '```'
            fi
          } > /tmp/comment.md

      - name: Find existing comment
        id: fc
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          # Without an author filter this matches whatever comment a human
          # wrote last, and the next step then writes a rendered manifest diff
          # into their remark.
          comment-author: 'github-actions[bot]'
          body-includes: '## Rendered manifest diff'
          direction: last

      - name: Post or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/comment.md
          # The action's default is `append`, which stacks a second full diff
          # section under the first on every push: the stale one stays on top,
          # and the body grows toward GitHub's 65536-character comment limit
          # until the update itself starts failing.
          edit-mode: replace
          reactions: "+1"
