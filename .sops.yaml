keys:
  - &MacStruble age1rae24hwrq3vnldppz92wkx2gqv6rml0vse76l52aaqra8m23pueqdyemh3
  - &roque age1s2jwgnw6cjk4pnyffplx6xcgutl975yynkd8lfplsndl87gyyq6srqrrdy
  - &mjolnir age1ng45h9zf4jsf5gvsypgt20m0h6h0jqep86dp7nnf2n9yj5k0gc8q5pe58t
creation_rules:
  - path_regex: nix/users/sops-secrets.yaml$
    key_groups:
      - age:
          - *MacStruble
          - *roque
          - *mjolnir
  - path_regex: nix/services/homelab/homelab-secrets.yaml$
    key_groups:
      - age:
          - *MacStruble
          - *roque
          - *mjolnir
  # AI/LiteLLM keys (pod-api-key, metrics-key): same recipients, split out so
  # they can be re-encrypted from this machine without touching the rest.
  - path_regex: nix/services/homelab/homelab-secrets-ai.yaml$
    key_groups:
      - age:
          - *MacStruble
          - *roque
          - *mjolnir
  # Wiki (BookStack) keys. Deliberately NOT *roque: the wiki database password
  # and OIDC client secret must not be decryptable by the host that runs the
  # IdP, the NAS mount and n8n's credential store. This is the one secret scope
  # in the repo with a per-host recipient set, and it is the shape the rest
  # moves to once the roque-only keys migrate out of homelab-secrets.yaml.
  - path_regex: nix/services/homelab/homelab-secrets-wiki.yaml$
    key_groups:
      - age:
          - *MacStruble
          - *mjolnir
